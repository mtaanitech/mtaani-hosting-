<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MtaaniHost</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1b2433;--mute:#667085;--line:#d9dfea;--brand:#0a6b45;--brand-d:#08553a;--red:#b42318;--blue:#1d4ed8;--amber:#b54708}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;padding:14px 14px 60px}
h1,h2{margin:0 0 6px;letter-spacing:-.01em}
h1{font-size:26px}h2{font-size:20px}
.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.narrow{max-width:420px;margin:8vh auto}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
button{padding:10px 16px;border:0;border-radius:8px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:var(--brand-d)}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.ghost:hover{background:#f4f6fa}
button.danger{background:#fff;color:var(--red);border:1px solid #f0c4c0}
button:disabled{opacity:.55;cursor:wait}
.row{display:flex;gap:8px;margin-top:14px}.wrap{flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.badge{padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;background:#e6eaf2;color:var(--mute);white-space:nowrap}
.badge.live,.badge.running{background:#d8f3e6;color:var(--brand)}
.badge.building,.badge.queued,.badge.restarting{background:#e0e9ff;color:var(--blue)}
.badge.failed,.badge.crashed{background:#fde4e1;color:var(--red)}
.badge.stopped{background:#fdecc8;color:var(--amber)}
.proj{cursor:pointer}.proj:hover{border-color:var(--brand)}
.tabs{display:flex;gap:6px;margin:14px 0 0}
.tabs button{background:transparent;color:var(--mute);border-bottom:2px solid transparent;border-radius:0;padding:8px 12px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.logs{background:#10161f;color:#d4dbe8;border-radius:8px;padding:10px;height:340px;overflow:auto;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;margin-top:10px}
.logs .err{color:#ff9b93}.logs .sys{color:#7ddba5}.logs .t{color:#6b778c}
.kv{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;margin-top:8px}
a{color:var(--blue)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}#toast.bad{background:var(--red)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let token = localStorage.getItem("token");
let me = localStorage.getItem("email");
let es = null, timer = null;

function toast(msg, bad) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "show" + (bad ? " bad" : "");
  clearTimeout(t._h);
  t._h = setTimeout(() => (t.className = ""), 3800);
}
function stopLive() {
  if (es) es.close();
  es = null;
  clearInterval(timer);
  timer = null;
}
function logout() {
  stopLive();
  token = null;
  localStorage.removeItem("token");
  viewAuth();
}
async function api(path, opts = {}) {
  const headers = {};
  if (token) headers.Authorization = "Bearer " + token;
  const o = { method: opts.method || "GET", headers };
  if (opts.json) { headers["Content-Type"] = "application/json"; o.body = JSON.stringify(opts.json); }
  if (opts.form) o.body = opts.form;
  const r = await fetch(path, o);
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { logout(); throw new Error("Please log in again."); }
  if (!r.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}
async function busy(btn, fn) {
  btn.disabled = true;
  try { await fn(); } catch (e) { toast(e.message, true); } finally { btn.disabled = false; }
}

// ------------------------------------------------------------ auth
function viewAuth() {
  $("#app").innerHTML = `
  <div class="card narrow">
    <h1>MtaaniHost</h1>
    <p class="mute">Deploy websites and WhatsApp, Telegram or Discord bots from GitHub or a ZIP file.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" value="${esc(me || "")}">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="At least 8 characters">
    <div class="row"><button id="login">Log in</button><button id="reg" class="ghost">Create account</button></div>
  </div>`;
  const go = (path) => (e) => busy(e.target, async () => {
    const d = await api(path, { method: "POST", json: { email: $("#email").value, password: $("#pw").value } });
    authDone(d);
  });
  $("#login").onclick = go("/api/auth/login");
  $("#reg").onclick = go("/api/auth/register");
}
function viewVerify(email) {
  $("#app").innerHTML = `
  <div class="card narrow">
    <h2>Check your email</h2>
    <p class="mute">We sent a 6-digit code to ${esc(email)}.</p>
    <label for="code">Verification code</label>
    <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    <div class="row"><button id="ok">Verify email</button></div>
  </div>`;
  $("#ok").onclick = (e) => busy(e.target, async () => authDone(await api("/api/auth/verify", { method: "POST", json: { email, code: $("#code").value } })));
}
function authDone(d) {
  if (d.needVerify) return viewVerify(d.email);
  token = d.token; me = d.email;
  localStorage.setItem("token", token);
  localStorage.setItem("email", me);
  viewList();
}

// ------------------------------------------------------------ project list
function header() {
  return `<div class="bar"><b>MtaaniHost</b><span><span class="mute">${esc(me)}</span> <button class="ghost" id="out">Log out</button></span></div>`;
}
async function viewList() {
  stopLive();
  $("#app").innerHTML = `${header()}
  <div class="between"><h2>Your projects</h2><button id="new">New project</button></div>
  <div id="plist"><p class="mute">Loading...</p></div>`;
  $("#out").onclick = logout;
  $("#new").onclick = viewNew;
  const refresh = async () => {
    try {
      const { projects } = await api("/api/projects");
      $("#plist").innerHTML = projects.length ? projects.map((p) => `
        <div class="card proj" data-id="${p.id}">
          <div class="between"><b>${esc(p.name)}</b><span class="badge ${p.status}">${p.status}</span></div>
          <div class="mute">${p.type === "bot" ? "Bot" : p.type === "site" ? "Website" : "Detecting type..."}${p.repo ? " · " + esc(p.repo) : ""}</div>
        </div>`).join("") : `<div class="card"><p>No projects yet. Choose New project to deploy your first website or bot.</p></div>`;
      document.querySelectorAll(".proj").forEach((el) => (el.onclick = () => viewProject(Number(el.dataset.id))));
    } catch (e) {}
  };
  refresh();
  timer = setInterval(refresh, 5000);
}

// ------------------------------------------------------------ new project
async function viewNew() {
  stopLive();
  let info;
  try { info = await api("/api/me"); } catch (e) { return toast(e.message, true); }
  $("#app").innerHTML = `${header()}
  <div class="bar"><button class="ghost" id="back">Back to projects</button></div>
  <div class="card"><h2>New project</h2>
    <div class="tabs"><button data-t="gh">GitHub repository</button><button data-t="zip">ZIP upload</button></div>
    <div id="npane"></div></div>`;
  $("#out").onclick = logout;
  $("#back").onclick = viewList;
  const kindSel = `<label for="kind">Project type</label><select id="kind"><option value="auto">Detect automatically</option><option value="site">Website</option><option value="bot">Bot or Node app</option></select>`;
  const tab = (t) => {
    document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === t));
    t === "gh" ? ghPane() : zipPane();
  };
  document.querySelectorAll(".tabs button").forEach((b) => (b.onclick = () => tab(b.dataset.t)));

  async function ghPane() {
    const pane = $("#npane");
    if (!info.github) {
      pane.innerHTML = `<p class="mute">Connect GitHub to import your repositories, including private ones.</p><button id="gh">Connect GitHub</button>`;
      $("#gh").onclick = (e) => busy(e.target, async () => { location.href = (await api("/api/github/connect")).url; });
      return;
    }
    pane.innerHTML = `<p class="mute">Loading your repositories...</p>`;
    let repos;
    try { repos = (await api("/api/github/repos")).repos; } catch (e) { pane.innerHTML = `<p>${esc(e.message)}</p>`; return; }
    if (!repos.length) { pane.innerHTML = `<p>No repositories found on this GitHub account.</p>`; return; }
    pane.innerHTML = `
      <label for="repo">Repository</label>
      <select id="repo">${repos.map((r) => `<option value="${esc(r.full_name)}" data-b="${esc(r.default_branch)}">${esc(r.full_name)}${r.private ? " (private)" : ""}</option>`).join("")}</select>
      <label for="branch">Branch</label><input id="branch">
      <label for="pname">Project name</label><input id="pname">
      ${kindSel}
      <div class="row"><button id="deploy">Deploy</button></div>`;
    const sync = () => { const o = $("#repo").selectedOptions[0]; $("#branch").value = o.dataset.b; $("#pname").value = o.value.split("/")[1]; };
    $("#repo").onchange = sync; sync();
    $("#deploy").onclick = (e) => busy(e.target, async () => {
      const { project } = await api("/api/projects", { method: "POST", json: { name: $("#pname").value, repo: $("#repo").value, branch: $("#branch").value, kind: $("#kind").value } });
      viewProject(project.id);
    });
  }
  function zipPane() {
    $("#npane").innerHTML = `
      <label for="zfile">ZIP file</label><input id="zfile" type="file" accept=".zip">
      <label for="pname">Project name</label><input id="pname">
      ${kindSel}
      <div class="row"><button id="deploy">Upload and deploy</button></div>`;
    $("#deploy").onclick = (e) => busy(e.target, async () => {
      const f = $("#zfile").files[0];
      if (!f) throw new Error("Choose a ZIP file.");
      const fd = new FormData();
      fd.append("name", $("#pname").value);
      fd.append("kind", $("#kind").value);
      fd.append("file", f);
      const { project } = await api("/api/projects/upload", { method: "POST", form: fd });
      viewProject(project.id);
    });
  }
  tab("gh");
}

// ------------------------------------------------------------ project page
async function viewProject(id, tab = "logs") {
  stopLive();
  let p;
  try { p = (await api("/api/projects/" + id)).project; } catch (e) { toast(e.message, true); return viewList(); }
  $("#app").innerHTML = `${header()}
  <div class="bar"><button class="ghost" id="back">Back to projects</button></div>
  <div class="card">
    <div class="between"><h2>${esc(p.name)}</h2><span id="badge" class="badge ${p.status}">${p.status}</span></div>
    <div id="meta" class="mute"></div>
    <div class="row wrap">
      <button id="redeploy">Redeploy</button>
      <button id="start" class="ghost">Start</button>
      <button id="stop" class="ghost">Stop</button>
      <button id="del" class="danger">Delete project</button>
    </div>
  </div>
  <div class="tabs"><button data-t="logs">Live logs</button><button data-t="env">Environment variables</button></div>
  <div id="pane"></div>`;
  $("#out").onclick = logout;
  $("#back").onclick = viewList;
  const meta = (q) => {
    $("#meta").innerHTML = (q.type === "bot" ? "Bot or Node app" : q.type === "site" ? "Website" : "Detecting type...") +
      (q.url && q.status === "live" ? ` · <a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.url)}</a>` : "");
  };
  meta(p);
  const act = (path, msg) => (e) => busy(e.target, async () => { await api(`/api/projects/${id}/${path}`, { method: "POST" }); toast(msg); });
  $("#redeploy").onclick = act("redeploy", "Deploy started. Watch the logs below.");
  $("#start").onclick = act("start", "Starting...");
  $("#stop").onclick = act("stop", "Stopped.");
  $("#del").onclick = (e) => busy(e.target, async () => {
    if (!confirm("Delete this project and all its files? This cannot be undone.")) return;
    await api("/api/projects/" + id, { method: "DELETE" });
    toast("Project deleted.");
    viewList();
  });
  const showTab = (t) => {
    if (es) es.close();
    es = null;
    document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === t));
    t === "logs" ? paneLogs(id, meta) : paneEnv(id);
  };
  document.querySelectorAll(".tabs button").forEach((b) => (b.onclick = () => showTab(b.dataset.t)));
  showTab(tab);
}

function paneLogs(id, meta) {
  $("#pane").innerHTML = `<div class="card">
    <div class="between"><b>Live logs</b><label class="mute" style="margin:0;font-weight:400"><input type="checkbox" id="follow" checked> Follow new lines</label></div>
    <div id="logs" class="logs" aria-live="off"></div></div>`;
  const box = $("#logs");
  es = new EventSource(`/api/projects/${id}/logs/stream?token=${encodeURIComponent(token)}`);
  es.onopen = () => (box.innerHTML = "");
  es.onmessage = async (ev) => {
    const d = JSON.parse(ev.data);
    if (d.type === "log") {
      const line = document.createElement("div");
      line.className = d.s;
      const time = document.createElement("span");
      time.className = "t";
      time.textContent = new Date(d.t).toLocaleTimeString() + "  ";
      line.append(time, document.createTextNode(d.m));
      box.appendChild(line);
      while (box.childElementCount > 1500) box.firstChild.remove();
      if ($("#follow") && $("#follow").checked) box.scrollTop = box.scrollHeight;
    } else if (d.type === "status") {
      const b = $("#badge");
      if (b) { b.className = "badge " + d.status; b.textContent = d.status; }
      try { meta((await api("/api/projects/" + id)).project); } catch (e) {}
    }
  };
}

async function paneEnv(id) {
  let vars;
  try { vars = (await api(`/api/projects/${id}/env`)).vars; } catch (e) { return toast(e.message, true); }
  $("#pane").innerHTML = `<div class="card">
    <b>Environment variables</b>
    <p class="mute">Add as many as you need. Bots receive them as process.env.NAME. Restart the project to apply changes.</p>
    <div id="rows"></div>
    <div class="row"><button class="ghost" id="addrow">Add variable</button></div>
    <label for="bulk">Paste several at once (one NAME=value per line)</label>
    <textarea id="bulk" rows="3"></textarea>
    <div class="row"><button class="ghost" id="bulkadd">Add pasted lines</button></div>
    <div class="row wrap"><button id="save">Save</button><button class="ghost" id="saverestart">Save and restart</button></div>
  </div>`;
  const rows = $("#rows");
  const addRow = (k = "", v = "") => {
    const d = document.createElement("div");
    d.className = "kv";
    d.innerHTML = `<input class="k" placeholder="NAME" aria-label="Variable name" value="${esc(k)}"><input class="v" placeholder="value" aria-label="Variable value" value="${esc(v)}"><button class="ghost x" aria-label="Remove variable">Remove</button>`;
    d.querySelector(".x").onclick = () => d.remove();
    rows.appendChild(d);
  };
  vars.forEach((v) => addRow(v.key, v.value));
  if (!vars.length) addRow();
  $("#addrow").onclick = () => addRow();
  $("#bulkadd").onclick = () => {
    for (const line of $("#bulk").value.split(/\r?\n/)) {
      const i = line.indexOf("=");
      if (i < 1 || line.trim().startsWith("#")) continue;
      addRow(line.slice(0, i).trim().replace(/^export\s+/, ""), line.slice(i + 1).trim().replace(/^(['"])(.*)\1$/, "$2"));
    }
    $("#bulk").value = "";
  };
  const collect = () => [...rows.querySelectorAll(".kv")].map((d) => ({ key: d.querySelector(".k").value.trim(), value: d.querySelector(".v").value })).filter((v) => v.key);
  const save = async () => { const r = await api(`/api/projects/${id}/env`, { method: "PUT", json: { vars: collect() } }); toast(`Saved ${r.count} variable${r.count === 1 ? "" : "s"}.`); };
  $("#save").onclick = (e) => busy(e.target, save);
  $("#saverestart").onclick = (e) => busy(e.target, async () => { await save(); await api(`/api/projects/${id}/start`, { method: "POST" }); toast("Saved. Restarting..."); });
}

// ------------------------------------------------------------ start
(function init() {
  const q = new URLSearchParams(location.search).get("github");
  if (q) {
    history.replaceState(null, "", "/");
    if (token) { toast(q === "connected" ? "GitHub connected." : "GitHub connection failed. Try again.", q !== "connected"); return viewNew(); }
  }
  token ? viewList() : viewAuth();
})();
</script>
</body>
</html>
