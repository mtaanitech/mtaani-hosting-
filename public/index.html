<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MtaaniHost — Deploy websites and bots in Kenya</title>
<meta name="description" content="Host your website or WhatsApp, Telegram and Discord bots in Kenya. Free trial, pay with M-Pesa.">
<script>
  // Tailwind must be told to use the "dark" class, otherwise the theme button does nothing.
  tailwind = { config: { darkMode: 'class' } };
  if (localStorage.getItem('mh_theme') === 'dark') document.documentElement.classList.add('dark');

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
  body{font-family:Inter,ui-sans-serif,system-ui,sans-serif}

  .grad-bg{background:linear-gradient(135deg,#10b981,#06b6d4 55%,#8b5cf6)}
  .glow{box-shadow:0 12px 40px -12px rgba(16,185,129,.55)}
  .hero-bg{background:radial-gradient(55rem 26rem at 15% -10%,rgba(16,185,129,.25),transparent),radial-gradient(50rem 26rem at 95% 0%,rgba(139,92,246,.25),transparent),radial-gradient(40rem 20rem at 50% 100%,rgba(6,182,212,.16),transparent)}
  .lift{transition:transform .2s,border-color .2s}.lift:hover{transform:translateY(-3px);border-color:rgba(16,185,129,.6)}

<body class="bg-gray-50 dark:bg-zinc-950 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">
<div id="root" class="flex flex-col flex-1 min-h-screen"></div>
<div id="toast-container" class="fixed bottom-5 right-5 z-[60] flex flex-col gap-2 max-w-xs"></div>
<div id="modal"></div>

<script>
/* ===================== config & state ===================== */
const SUPPORT_WHATSAPP = ''; // optional: your number like 2547XXXXXXXX (shows a WhatsApp support link)
// Same origin when served from Render/localhost, otherwise talk to the Render backend (needs CORS_ORIGINS on the server)
const API_BASE = (typeof window.MH_API === 'string') ? window.MH_API
  : (/(^|\.)onrender\.com$|^localhost$|^127\./.test(location.hostname) ? '' : 'https://mtaani-hosting.onrender.com');

let token = localStorage.getItem('mh_token');
let atoken = sessionStorage.getItem('mh_admin');
let me = null, health = null, pollT = null, ghKind = 'website';
let cfg = { price: 130, trialDays: 7, human: 'math' };
let humanTok = '', cfToken = '';
let pendingEmail = localStorage.getItem('mh_pending') || '';

/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inp = 'w-full rounded-lg border border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500';
const btn = 'grad-bg inline-flex items-center justify-center gap-2 rounded-lg text-white px-4 py-2 text-sm font-semibold hover:opacity-90 disabled:opacity-50';
const btn2 = 'inline-flex items-center justify-center gap-2 rounded-lg border border-gray-300 dark:border-zinc-700 px-3 py-1.5 text-sm hover:bg-emerald-50 dark:hover:bg-zinc-800 hover:border-emerald-500';
const btnDanger = 'inline-flex items-center justify-center gap-2 rounded-lg border border-red-400 text-red-600 px-3 py-1.5 text-sm hover:bg-red-50 dark:hover:bg-red-500/10';
const card = 'rounded-2xl border border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-900';
const ddItem = 'flex w-full items-center gap-3 px-3 py-2 text-sm rounded-lg text-left text-gray-700 dark:text-gray-200 hover:bg-emerald-50 dark:hover:bg-zinc-800 hover:text-emerald-600 cursor-pointer';
const logo = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><path d="M12 2 22 20H2L12 2Z" fill="url(#lg1)"/><path d="M12 9l4.5 8h-9L12 9Z" fill="#fff" fill-opacity=".9"/></svg>`;

function toast(msg, bad) {
  const box = $('#toast-container'); if (!box) return;
  const d = document.createElement('div');
  d.className = `rounded-lg px-4 py-3 text-sm shadow-lg text-white fadein ${bad ? 'bg-red-600' : 'bg-emerald-600'}`;
  d.textContent = msg; box.appendChild(d); setTimeout(() => d.remove(), 4000);
}
async function api(p, o = {}, t = token) {
  const fd = o.body instanceof FormData;
  const h = fd ? {} : { 'Content-Type': 'application/json' };
  if (t) h.Authorization = 'Bearer ' + t;
  let r;
  try { r = await fetch(API_BASE + '/api' + p, { ...o, headers: h, body: o.body && !fd ? JSON.stringify(o.body) : o.body }); }
  catch { throw new Error('Cannot reach the server. Check your internet or try again in a minute (free servers wake up slowly).'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'Something went wrong'); e.status = r.status; e.data = j; throw e; }
  return j;
}
function setTheme(d) { document.documentElement.classList.toggle('dark', d); localStorage.setItem('mh_theme', d ? 'dark' : 'light'); }
function toggleTheme() { setTheme(!document.documentElement.classList.contains('dark')); }
function logout() { token = null; me = null; localStorage.removeItem('mh_token'); location.hash = '#/'; }
async function loadCfg() { try { cfg = await api('/config', {}, null); } catch {} }
async function loadMe() { if (!token) return null; try { me = await api('/me'); } catch (e) { if (e.status === 401) { token = null; localStorage.removeItem('mh_token'); } me = null; } return me; }
async function requireAuth() {
  if (await loadMe()) return true;
  if (token) { // still have a token but the server did not answer (e.g. free server waking up): do not bounce to login
    publicShell(`<div class="max-w-md mx-auto px-4 py-24 text-center"><div class="text-4xl mb-3">⏳</div><h1 class="text-xl font-bold mb-2">The server is waking up</h1><p class="text-sm text-gray-500 mb-6">Free servers sleep when idle and can take up to a minute to start. Please try again.</p><button class="${btn}" onclick="route()">Try again</button></div>`);
    return false;
  }
  location.hash = '#/login'; return false;
}
function goTo(id) {
  const scroll = () => document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
  if (location.hash && location.hash !== '#/') { location.hash = '#/'; setTimeout(scroll, 150); } else scroll();
}
const statusHtml = () => health === null ? 'Checking system…' : health.ok ? '<span class="text-emerald-500">●</span> API online' : '<span class="text-red-500">●</span> API unreachable';
async function checkHealth() { try { health = await api('/health', {}, null); } catch { health = { ok: false }; } const el = $('#apiStatus'); if (el) el.innerHTML = statusHtml(); }
function fmtUp(s) { if (!s) return '—'; const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`; }
function fmtB(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round((b || 0) / 1024)) + ' KB'; }
const badge = s => { const c = { live: 'emerald', running: 'emerald', starting: 'amber', stopped: 'zinc', suspended: 'red' }[s] || 'zinc'; return `<span class="rounded-full px-2 py-0.5 text-xs bg-${c}-500/15 text-${c}-500 border border-${c}-500/30">${esc(s)}</span>`; };

/* ===================== shells ===================== */
function headerHtml(mode) {
  const themeBtn = `<button onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme" class="h-9 w-9 rounded-full hover:bg-gray-100 dark:hover:bg-zinc-800 grid place-items-center"><i class="fas fa-adjust"></i></button>`;
  const lk = 'hidden sm:block px-2 text-gray-500 hover:text-gray-900 dark:hover:text-white cursor-pointer text-sm';
  let right = '', left = '';
  if (mode === 'app') {
    left = `<button onclick="toggleSidebar()" class="md:hidden h-9 w-9 grid place-items-center text-gray-600 dark:text-gray-300" aria-label="Menu"><i class="fas fa-bars fa-lg"></i></button>`;
    const nm = me?.displayName || me?.email || '?';
    right = `${themeBtn}<div class="relative">
      <button id="settingsBtn" onclick="toggleSettings(event)" aria-haspopup="true" class="flex items-center gap-2 rounded-full border border-gray-200 dark:border-zinc-700 pl-1 pr-3 py-1 hover:bg-gray-100 dark:hover:bg-zinc-800"><span class="h-8 w-8 rounded-full grad-bg text-white grid place-items-center text-sm font-bold">${esc(nm[0].toUpperCase())}</span><i class="fas fa-cog text-gray-500"></i></button>
      <div id="settingsDropdown" class="hidden absolute right-0 top-full mt-2 w-64 rounded-xl border border-gray-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 shadow-xl p-2 z-50">
        <div class="px-3 py-2 mb-1 border-b border-gray-200 dark:border-zinc-700"><div class="font-semibold text-sm truncate">${esc(nm)}</div><div class="text-xs text-gray-500 truncate">${esc(me?.email || '')}</div></div>
        <a class="${ddItem}" href="#/profile"><i class="fas fa-user w-4"></i> My Profile</a>
        <a class="${ddItem}" href="#/settings"><i class="fas fa-cog w-4"></i> Settings</a>
        <a class="${ddItem}" href="#/billing"><i class="fas fa-credit-card w-4"></i> Billing &amp; Payments</a>
        <button class="${ddItem}" onclick="toggleTheme()"><i class="fas fa-adjust w-4"></i> Switch Dark / Light</button>
        <div class="my-1 border-t border-gray-200 dark:border-zinc-700"></div>
        <button class="${ddItem} !text-red-600" onclick="logout()"><i class="fas fa-sign-out-alt w-4"></i> Logout</button>
      </div></div>`;
  } else if (mode === 'admin') {
    right = `${themeBtn}${atoken ? `<button class="${btn2}" onclick="adminLogout()">Admin logout</button>` : ''}<a class="${btn2}" href="#/">Home</a>`;
  } else {
    right = `<a class="${lk}" onclick="goTo('features')">Features</a><a class="${lk}" onclick="goTo('how')">How it works</a><a class="${lk}" onclick="goTo('pricing')">Pricing</a><a class="${lk}" onclick="goTo('faq')">FAQ</a>${themeBtn}
      ${token ? `<a class="${btn}" href="#/dashboard">Dashboard</a>` : `<a class="${btn2}" href="#/login">Login</a><a class="${btn}" href="#/signup">Sign Up</a>`}`;
  }
  return `<header class="sticky top-0 z-40 backdrop-blur border-b border-gray-200 dark:border-zinc-800 bg-white/85 dark:bg-zinc-950/85">
    <div class="px-4 h-16 flex items-center justify-between gap-2 ${mode === 'public' ? 'max-w-6xl mx-auto' : ''}">
      <div class="flex items-center gap-2">${left}<a href="#/" class="flex items-center gap-2 font-bold text-lg">${logo}<span>Mtaani<span class="grad-text">Host</span></span></a></div>
      <div class="flex items-center gap-2">${right}</div></div></header>`;
}
function footerHtml() {
  const h4 = 'font-semibold text-gray-900 dark:text-gray-100 mb-3';
  return `<footer class="border-t border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-6 py-10 text-sm text-gray-500">
    <div class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-8">
      <div><h4 class="${h4}">MtaaniHost</h4><p>Deploy websites and bots in Kenya with ease.</p></div>
      <div><h4 class="${h4}">How it works</h4><ul class="space-y-2"><li>1. Sign up with your email and password</li><li>2. Upload a ZIP or import from GitHub</li><li>3. Share your live link</li></ul></div>
      <div><h4 class="${h4}">Pricing</h4><p>KES ${esc(cfg.price)} per month after a ${esc(cfg.trialDays)}-day free trial.</p></div>
      <div><h4 class="${h4}">Support</h4><ul class="space-y-2"><li><a class="hover:text-emerald-600 cursor-pointer" onclick="goTo('faq')">FAQ</a></li><li><a class="hover:text-emerald-600" href="#/billing">Billing</a></li>${SUPPORT_WHATSAPP ? `<li><a class="hover:text-emerald-600" href="https://wa.me/${esc(SUPPORT_WHATSAPP)}" target="_blank" rel="noopener">WhatsApp support</a></li>` : ''}<li><a class="hover:text-emerald-600" href="#/admin">Admin</a></li></ul></div>
    </div>
    <div class="mt-8 text-center text-xs">© ${new Date().getFullYear()} MtaaniHost · Nairobi, Kenya · <span id="apiStatus">${statusHtml()}</span></div></footer>`;
}
const NAV = [
  ['dashboard', 'fas fa-layer-group', 'Projects', '#/dashboard'],
  ['deploy-website', 'fas fa-globe', 'Deploy Website', '#/deploy/website'],
  ['deploy-bot', 'fas fa-robot', 'Deploy Bot', '#/deploy/bot'],
  ['github', 'fab fa-github', 'GitHub Import', '#/github'],
  ['billing', 'fas fa-credit-card', 'Billing', '#/billing'],
  ['profile', 'fas fa-user', 'Profile', '#/profile'],
  ['settings', 'fas fa-cog', 'Settings', '#/settings']
];
function appShell(active, inner) {
  const items = NAV.map(n => `<a href="${n[3]}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm ${n[0] === active ? 'bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 font-semibold' : 'text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-zinc-800'}"><i class="${n[1]} w-4 text-center"></i> ${n[2]}</a>`).join('');
  $('#root').innerHTML = `${headerHtml('app')}
    <div class="flex flex-1 min-h-0">
      <aside id="sidebar" class="fixed md:static top-16 bottom-0 left-0 z-30 w-56 shrink-0 -translate-x-full md:translate-x-0 transition-transform bg-white dark:bg-zinc-900 border-r border-gray-200 dark:border-zinc-800 shadow-lg md:shadow-none"><nav class="p-3 space-y-1">${items}</nav></aside>
      <main class="flex-1 min-w-0 p-4 sm:p-6 fadein">${inner}</main>
    </div>${footerHtml()}`;
}
function publicShell(inner) { $('#root').innerHTML = `${headerHtml('public')}<main class="flex-1 fadein">${inner}</main>${footerHtml()}`; }
function adminShell(inner) { $('#root').innerHTML = `${headerHtml('admin')}<main class="flex-1 p-4 sm:p-6 fadein">${inner}</main>${footerHtml()}`; }
function toggleSidebar() { $('#sidebar')?.classList.toggle('-translate-x-full'); }
function toggleSettings(ev) { ev?.stopPropagation(); $('#settingsDropdown')?.classList.toggle('hidden'); }
document.addEventListener('click', e => {
  const dd = $('#settingsDropdown');
  if (dd && !e.target.closest('#settingsDropdown') && !e.target.closest('#settingsBtn')) dd.classList.add('hidden');
});

/* ===================== public pages ===================== */

  const T = cfg.trialDays, P = cfg.price;

  ];
  const faqs = [

    ['Is my account safe?', 'Passwords are stored encrypted and your secret keys are hidden once saved. Never share your password or bot tokens with anyone.']

  publicShell(`
  <section class="hero-bg"><div class="max-w-5xl mx-auto px-4 pt-20 pb-24 text-center">
    <span class="inline-block rounded-full border border-emerald-500/40 bg-emerald-500/10 px-4 py-1 text-xs font-medium text-emerald-600 mb-6">🇰🇪 Built in Kenya · ${esc(T)} days free · Pay with M-Pesa</span>

    <p class="mt-4 text-xs text-gray-500">No card needed to start · Cancel any time</p>
    <div class="mt-14 max-w-2xl mx-auto text-left rounded-2xl border border-zinc-800 bg-zinc-950 glow overflow-hidden">

✔ Extracted 24 files

    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${feats.map(f => `<div class="${card} lift p-6"><div class="h-12 w-12 rounded-xl ${col[f[3]]} grid place-items-center text-2xl mb-4">${f[0]}</div><h3 class="font-semibold mb-2">${f[1]}</h3><p class="text-sm text-gray-500 leading-relaxed">${f[2]}</p></div>`).join('')}</div>

  </section>

/* "Verify you are human": Cloudflare Turnstile when the server has keys, otherwise a small math question */
function loadTurnstile() {
  return new Promise((ok, no) => {
    const t0 = Date.now();
    if (!document.querySelector('script[data-turnstile]')) {
      const s = document.createElement('script'); s.dataset.turnstile = '1'; s.async = true;
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      s.onerror = () => no(new Error('Could not load the human check'));
      document.head.appendChild(s);
    }
    const iv = setInterval(() => {
      if (window.turnstile) { clearInterval(iv); ok(); }
      else if (Date.now() - t0 > 8000) { clearInterval(iv); no(new Error('Could not load the human check')); }
    }, 60);
  });
}
async function setupHuman() {
  const box = $('#human'); if (!box) return;
  humanTok = ''; cfToken = '';
  if (cfg.human === 'turnstile' && cfg.turnstileSiteKey) {
    box.innerHTML = '<div id="cft"></div>';
    try {
      await loadTurnstile();
      window.turnstile.render('#cft', { sitekey: cfg.turnstileSiteKey, theme: document.documentElement.classList.contains('dark') ? 'dark' : 'light', callback: t => { cfToken = t; }, 'expired-callback': () => { cfToken = ''; } });
    } catch (e) { box.innerHTML = `<p class="text-xs text-red-600">${esc(e.message)}. Refresh the page.</p>`; }
    return;
  }
  try {
    const h = await api('/human', {}, null);
    humanTok = h.token;
    box.innerHTML = `<label class="text-sm text-gray-500">Verify you're human: what is <b>${esc(h.question)}</b> ?</label>
      <div class="flex gap-2 mt-1"><input class="${inp}" id="ha" inputmode="numeric" autocomplete="off" placeholder="Your answer" required><button type="button" class="${btn2}" id="hr" title="New question">↻</button></div>`;
    $('#hr').onclick = setupHuman;
  } catch (e) { box.innerHTML = `<p class="text-xs text-red-600">${esc(e.message)}</p>`; }
}

    <div class="flex items-center gap-4 mb-8"><div class="h-16 w-16 rounded-full grad-bg text-white grid place-items-center text-2xl font-bold">${esc((p.displayName || p.email)[0].toUpperCase())}</div>
      <div><h1 class="text-2xl font-extrabold">${esc(p.displayName)}</h1><p class="text-sm text-gray-500">${esc(p.email)}</p></div></div>
    <div class="${card} px-6 py-2">${row('Plan', badge(p.status === 'paid' ? 'live' : p.status === 'trial' ? 'starting' : 'suspended').replace(/>[^<]+</, `>${esc(p.status)}<`))}${row('Days left', p.daysLeft)}${row('Member since', new Date(p.memberSince).toLocaleDateString())}${row('Projects', `${p.projects} (${p.websites} websites, ${p.bots} bots)`)}</div>
    <div class="mt-6 flex gap-2"><a class="${btn}" href="#/settings">Edit settings</a><a class="${btn2}" href="#/billing">Billing</a></div></div>`);
}
async function settingsView() {
  if (!(await requireAuth())) return;
  let p; try { p = await api('/profile'); } catch (e) { toast(e.message, true); return; }
  const dark = document.documentElement.classList.contains('dark');
  const soon = ['Notifications', 'Language', 'API keys', 'Custom domains', 'Backups', 'Two-factor authentication', 'Team members'];
  appShell('settings', `<div class="max-w-xl mx-auto space-y-6"><h1 class="text-2xl font-extrabold">Settings</h1>
    <form id="fn" class="${card} p-6 space-y-3"><h2 class="font-semibold">Profile</h2>
      <label class="text-sm text-gray-500">Display name</label><input class="${inp}" id="dn" maxlength="40" value="${esc(p.displayName)}" required>
      <label class="text-sm text-gray-500">Email</label><input class="${inp} opacity-60" value="${esc(p.email)}" disabled>
      <button class="${btn}">Save</button></form>
    <form id="fp" class="${card} p-6 space-y-3"><h2 class="font-semibold">Change password</h2>
      <input class="${inp}" type="password" id="cp" placeholder="Current password" required autocomplete="current-password">
      <input class="${inp}" type="password" id="np" placeholder="New password (at least 8 characters)" minlength="8" required autocomplete="new-password">
      <input class="${inp}" type="password" id="np2" placeholder="Confirm new password" required autocomplete="new-password">
      <button class="${btn}">Update password</button></form>
    <div class="${card} p-6 space-y-3"><h2 class="font-semibold">Appearance</h2>
      <div class="flex gap-2"><button id="tl" class="${btn2} ${dark ? '' : '!border-emerald-500 !text-emerald-600'}">☀️ Light</button><button id="td" class="${btn2} ${dark ? '!border-emerald-500 !text-emerald-600' : ''}">🌙 Dark</button></div></div>
    <div class="${card} p-6"><h2 class="font-semibold mb-3">Coming soon</h2><div class="flex flex-wrap gap-2">${soon.map(s => `<span class="rounded-full border border-gray-300 dark:border-zinc-700 px-3 py-1 text-xs text-gray-500">${s}</span>`).join('')}</div><p class="text-xs text-gray-500 mt-3">These features are planned but not available yet.</p></div>
    <form id="fd" class="${card} p-6 space-y-3 !border-red-400/60"><h2 class="font-semibold text-red-600">Delete account</h2>
      <p class="text-sm text-gray-500">This permanently deletes your account and all your projects, and stops your bots. It cannot be undone.</p>
      <input class="${inp}" type="password" id="dp" placeholder="Confirm with your password" required>
      <button class="${btnDanger}">Delete my account</button></form></div>`);
  $('#fn').onsubmit = async e => { e.preventDefault(); try { await api('/profile', { method: 'PUT', body: { displayName: $('#dn').value } }); toast('Profile saved'); await loadMe(); } catch (err) { toast(err.message, true); } };
  $('#fp').onsubmit = async e => {
    e.preventDefault();
    if ($('#np').value !== $('#np2').value) return toast('New passwords do not match', true);
    try { await api('/settings/password', { method: 'POST', body: { currentPassword: $('#cp').value, newPassword: $('#np').value } }); toast('Password updated'); e.target.reset(); }
    catch (err) { toast(err.message, true); }
  };
  $('#tl').onclick = () => { setTheme(false); settingsView(); };
  $('#td').onclick = () => { setTheme(true); settingsView(); };
  $('#fd').onsubmit = async e => {
    e.preventDefault();
    if (!confirm('Delete your account permanently?')) return;
    try { await api('/account', { method: 'DELETE', body: { password: $('#dp').value } }); toast('Account deleted'); logout(); }
    catch (err) { toast(err.message, true); }
  };
}

/* ===================== admin ===================== */
function adminLogout() { atoken = null; sessionStorage.removeItem('mh_admin'); adminView(); }
async function adminView() {
  if (!atoken) {
    adminShell(`<div class="max-w-sm mx-auto py-16"><div class="${card} p-8"><h1 class="text-xl font-bold text-center mb-6">Admin Login</h1>${health && health.adminConfigured === false ? '<p class="mb-4 text-sm text-red-600">⚠️ ADMIN_PASSWORD is not set, so the server made a temporary admin password. Open Render → your service → Logs and search for “ADMIN PASSWORD”. To choose your own, add ADMIN_PASSWORD under Environment and redeploy.</p>' : ''}<form id="f" class="space-y-3"><input class="${inp}" type="password" id="pw" placeholder="Admin password" required><button class="${btn} w-full">Login</button></form></div></div>`);
    $('#f').onsubmit = async e => { e.preventDefault(); try { const r = await api('/admin/login', { method: 'POST', body: { password: $('#pw').value } }, null); atoken = r.token; sessionStorage.setItem('mh_admin', atoken); adminView(); } catch (err) { toast(err.message, true); } };
    return;
  }
  let d;
  try { d = await api('/admin/overview', {}, atoken); }
  catch (e) {
    if (e.status === 401) { atoken = null; sessionStorage.removeItem('mh_admin'); toast('Admin session expired. Please log in again.', true); return adminView(); }
    adminShell(`<div class="max-w-md mx-auto py-16 text-center"><h1 class="text-xl font-bold mb-2">Could not load the admin panel</h1><p class="text-sm text-red-600 mb-4">${esc(e.message)}</p><button class="${btn}" onclick="adminView()">Try again</button></div>`);
    return;
  }
  let st = { price: cfg.price, trialDays: cfg.trialDays }; try { st = await api('/admin/settings', {}, atoken); } catch {}
  await checkHealth();
  const s = d.stats, stat = (a, b) => `<div class="${card} p-4"><div class="text-xs text-gray-500">${a}</div><div class="text-2xl font-extrabold mt-1">${b}</div></div>`;
  const th = 'text-left text-xs text-gray-500 font-normal py-2 pr-4', td = 'py-2 pr-4 text-sm';
  const storeWarn = health && health.onRender && !health.persistent ? `<div class="${card} p-4 !border-amber-500 text-sm text-amber-600">⚠️ Data is not on a persistent disk. Accounts and projects disappear whenever the server restarts or redeploys. Add a Render Disk and set DATA_DIR.</div>` : '';
  const mailWarn = health && health.requireVerify && health.mail === 'none' ? `<div class="${card} p-4 !border-red-500 text-sm text-red-600">⚠️ Email is not configured, so verification codes cannot be sent. Set BREVO_API_KEY + MAIL_FROM (or GMAIL_USER + GMAIL_APP_PASSWORD on a paid Render plan).</div>` : '';
  adminShell(`<div class="max-w-6xl mx-auto space-y-8">
    <h1 class="text-2xl font-extrabold">Admin Panel</h1>${mailWarn}${storeWarn}
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">${stat('Users', s.users)}${stat('Free trial', s.trial)}${stat('Paid', s.paid)}${stat('Unpaid (expired)', s.expired)}${stat('Blocked', s.blocked)}${stat('Projects', s.projects)}${stat('Live sites', s.liveSites)}${stat('Bots running', s.runningBots)}${stat('Revenue', 'KES ' + s.revenue)}${stat('Email delivery', esc(health ? health.mail : '?'))}</div>
    <section class="${card} p-6"><h2 class="font-semibold mb-1">Pricing and free trial</h2><p class="text-sm text-gray-500 mb-4">Changes apply to new payments and new sign-ups. Time that users already paid for is not affected.</p>
      <form id="fs" class="grid sm:grid-cols-3 gap-3 items-end">
        <div><label class="text-xs text-gray-500">Monthly price (KES)</label><input class="${inp} mt-1" type="number" min="10" max="100000" id="sp" value="${esc(st.price)}" required></div>
        <div><label class="text-xs text-gray-500">Free trial (days)</label><input class="${inp} mt-1" type="number" min="0" max="60" id="sd" value="${esc(st.trialDays)}" required></div>
        <button class="${btn}">Save</button></form></section>
    <section><h2 class="font-semibold mb-3">Users</h2><div class="${card} p-4 overflow-x-auto"><table class="w-full"><tr><th class="${th}">Email</th><th class="${th}">Status</th><th class="${th}">Days left</th><th class="${th}">Projects</th><th class="${th}"></th></tr>
    ${d.users.map(u => `<tr class="border-t border-gray-200 dark:border-zinc-800"><td class="${td}">${esc(u.email)}</td><td class="${td}">${esc(u.status)}</td><td class="${td}">${u.daysLeft}</td><td class="${td}">${u.projects}</td><td class="${td}"><div class="flex gap-2">${u.status === 'unverified' ? `<button class="${btn2}" onclick="adm('/users/${u.id}/verify',{})">Verify</button>` : ''}<button class="${btn2}" onclick="adm('/users/${u.id}/block',{blocked:${!u.blocked}})">${u.blocked ? 'Unblock' : 'Block'}</button><button class="${btn2}" onclick="adm('/users/${u.id}/extend',{days:30})">+30d</button></div></td></tr>`).join('')}</table></div></section>
    <section><h2 class="font-semibold mb-3">Projects</h2><div class="${card} p-4 overflow-x-auto"><table class="w-full"><tr><th class="${th}">Name</th><th class="${th}">Owner</th><th class="${th}">Type</th><th class="${th}">Status</th><th class="${th}"></th></tr>
    ${d.projects.map(p => `<tr class="border-t border-gray-200 dark:border-zinc-800"><td class="${td}">${esc(p.name)}</td><td class="${td}">${esc(p.owner)}</td><td class="${td}">${esc(p.type)}</td><td class="${td}">${esc(p.status)}</td><td class="${td}"><div class="flex gap-2"><button class="${btn2}" onclick="adm('/projects/${p.id}/suspend',{suspended:${p.suspendedBy !== 'admin'}})">${p.suspendedBy === 'admin' ? 'Resume' : 'Suspend'}</button><button class="${btnDanger}" onclick="if(confirm('Delete this project?'))adm('/projects/${p.id}',null,'DELETE')">Delete</button></div></td></tr>`).join('')}</table></div></section>
    <section><h2 class="font-semibold mb-3">Payments</h2><div class="${card} p-4 overflow-x-auto"><table class="w-full"><tr><th class="${th}">Date</th><th class="${th}">Email</th><th class="${th}">Amount</th><th class="${th}">Channel</th></tr>
    ${d.payments.map(p => `<tr class="border-t border-gray-200 dark:border-zinc-800"><td class="${td}">${new Date(p.at).toLocaleString()}</td><td class="${td}">${esc(p.email)}</td><td class="${td}">KES ${esc(p.amount)}</td><td class="${td}">${esc(p.channel)}</td></tr>`).join('') || `<tr><td class="${td} text-gray-500" colspan="4">No payments yet</td></tr>`}</table></div></section></div>`);
  $('#fs').onsubmit = async e => {
    e.preventDefault();
    try { const r = await api('/admin/settings', { method: 'PUT', body: { price: $('#sp').value, trialDays: $('#sd').value } }, atoken); cfg = { ...cfg, ...r }; toast('Pricing saved'); }
    catch (err) { toast(err.message, true); }
  };
}
async function adm(path, body, method) { try { await api('/admin' + path, { method: method || 'POST', body }, atoken); toast('Done'); adminView(); } catch (e) { toast(e.message, true); } }

/* ===================== router ===================== */
function route() {
  clearInterval(pollT); $('#modal').innerHTML = '';
  const h = (location.hash || '#/').split('?')[0];
  window.scrollTo(0, 0);
  if (token && (h === '#/login' || h === '#/signup')) { location.hash = '#/dashboard'; return; }
  const R = {
    '#/': landing, '#/login': () => authView('login'), '#/signup': () => authView('signup'), '#/verify': verifyView,
    '#/dashboard': dashboardView, '#/deploy/website': () => deployView('website'), '#/deploy/bot': () => deployView('bot'), '#/github': () => deployView('github'),
    '#/billing': billingView, '#/profile': profileView, '#/settings': settingsView, '#/admin': adminView
  };
  (R[h] || landing)();
}
addEventListener('hashchange', route);
Promise.all([loadCfg(), checkHealth()]).finally(route);
setInterval(checkHealth, 60000);
</script>
</body>
</html>
