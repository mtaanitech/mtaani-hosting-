async function api(path,opts={},auth=token){const fd=opts.body instanceof FormData;const headers={...(fd?{}:{'Content-Type':'application/json'}),...(auth?{Authorization:'Bearer '+auth}:{})};let res;try{res=await fetch(API_BASE+'/api'+path,{...opts,headers,body:opts.body&&!fd?JSON.stringify(opts.body):opts.body})}catch{throw Error('Cannot reach the server. The free server may be waking up; try again shortly.')}const data=await res.json().catch(()=>({}));if(!res.ok){const e=Error(data.error||'Request failed');e.status=res.status;e.data=data;throw e}return data}
function setTheme(light){document.documentElement.classList.toggle('dark',!light);localStorage.setItem('mh_theme',light?'light':'dark')}
function logout(){token='';me=null;localStorage.removeItem('mh_token');location.hash='#/'}
async function loadCfg(){try{cfg={...cfg,...await api('/config',{},null)}}catch{}}
async function loadMe(){if(!token)return null;try{me=await api('/me');return me}catch(e){if(e.status===401){token='';localStorage.removeItem('mh_token')}me=null;return null}}
async function checkHealth(){try{health=await api('/health',{},null)}catch{health={ok:false}}const el=$('#apiStatus');if(el)el.innerHTML=health.ok?'<span class="text-emerald-400">●</span> Systems operational':'<span class="text-red-400">●</span> API unavailable'}

async function checkGitHubRepos(force){
  try{
    const repos=await api('/github/repos');
    ghRepos=repos;
    renderRepoList(repos)
  }catch(e){
    const list=$('#ghList');
    if(list)list.innerHTML=`<div class="rounded-xl bg-amber-500/10 border border-amber-400/20 p-4 text-sm muted">${esc(e.message)}<p class="mt-2">Use Connect / refresh to authorize GitHub, or confirm GitHub OAuth is configured on the server.</p></div>`;
    if(force)toast(e.message,true)
  }
}

function renderRepoList(repos){
  const list=$('#ghList');
  if(!list)return;
  if(!repos.length){
    list.innerHTML='<p class="muted text-sm py-5">No repositories were returned by GitHub.</p>';
    return
  }
  list.innerHTML=repos.map(r=>`<div class="repo-item flex flex-wrap items-center justify-between gap-3 rounded-xl border border-[#1e3858] p-4" data-name="${esc(r.full_name.toLowerCase())}"><div class="min-w-0"><b>${esc(r.full_name)} ${r.private?'🔒':''}</b><p class="muted text-xs mt-1">Updated ${esc(r.updated_at?new Date(r.updated_at).toLocaleDateString():'—')}</p></div><button class="btn" onclick="importGhRepo('${esc(r.clone_url)}','${esc(r.name)}')">Import repository</button></div>`).join('')
}

function filterRepos(q){
  document.querySelectorAll('.repo-item').forEach(el=>{
    el.style.display=el.dataset.name.includes(q.toLowerCase())?'':'none'
  })
}

async function importGhRepo(url,name){
  const finalName=prompt('Project name:',name)||name;
  if(!finalName)return;
  let envVars='';
  if(ghKind==='bot'){
    envVars=prompt('Environment variables (KEY=value, one per line):','')||''
  }
  const fd=new FormData();
  fd.append('name',finalName);
  fd.append('githubUrl',url);
  if(ghKind==='bot'){
    fd.append('botType','baileys');
    fd.append('envVars',envVars)
  }
  try{
    toast('Importing repository…');
    const p=await api(
      ghKind==='bot'?'/projects/bot':'/projects/website',
      {method:'POST',body:fd}
    );
    toast('Repository import submitted');
    if(p.url)window.open(p.url,'_blank','noopener');
    location.hash='#/dashboard'
  }catch(e){
    toast(e.message,true);
    if(e.status===402)location.hash='#/billing'
  }
}

    <h1 class="text-3xl font-extrabold mb-2">Settings</h1>
    <p class="muted mb-7">Manage your profile, password and appearance.</p>

    <form id="profileForm" class="panel p-6 space-y-4 mb-5">
      <h2 class="font-bold text-lg">Profile information</h2>
      <div>
        <label class="text-sm muted">Display name</label>
        <input class="field mt-1" id="displayName" maxlength="40" required value="${esc(p.displayName||'')}">
      </div>
      <div>
        <label class="text-sm muted">Email address</label>
        <input class="field mt-1 opacity-60" disabled value="${esc(p.email)}">
      </div>
      <button class="btn">Save profile</button>
    </form>

    <form id="passwordForm" class="panel p-6 space-y-4 mb-5">
      <h2 class="font-bold text-lg">Change password</h2>
      <input class="field" id="currentPassword" type="password" autocomplete="current-password" required placeholder="Current password">
      <input class="field" id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="New password (at least 8 characters)">
      <input class="field" id="confirmPassword" type="password" required placeholder="Confirm new password">
      <button class="btn">Update password</button>
    </form>

    <div class="panel p-6 mb-5">
      <h2 class="font-bold text-lg">Appearance</h2>
      <p class="muted text-sm mt-1 mb-4">Choose the theme that feels right for you.</p>
      <div class="flex gap-3">
        <button class="btn2" onclick="setTheme(true);settingsView()">☀️ Light</button>
        <button class="btn2" onclick="setTheme(false);settingsView()">🌙 Dark</button>
      </div>
    </div>

    <div class="panel p-6 border-red-500/30">
      <h2 class="font-bold text-lg text-red-300">Delete account</h2>
      <p class="muted text-sm mt-2">This is permanent and may remove your projects. Continue only if you are certain.</p>
      <form id="deleteAccountForm" class="mt-4 space-y-3">
        <input class="field" id="deletePassword" type="password" required placeholder="Confirm your password">
        <button class="btn2 text-red-300 border-red-500/40">Delete my account</button>
      </form>
    </div>
  </div>`);

  $('#profileForm').onsubmit=async e=>{
    e.preventDefault();
    try{
      await api('/profile',{
        method:'PUT',
        body:{displayName:$('#displayName').value.trim()}
      });
      toast('Profile saved');
      await loadMe()
    }catch(err){
      toast(err.message,true)
    }
  };

  $('#passwordForm').onsubmit=async e=>{
    e.preventDefault();
    if($('#newPassword').value!==$('#confirmPassword').value)
      return toast('Passwords do not match',true);

    try{
      await api('/settings/password',{
        method:'POST',
        body:{
          currentPassword:$('#currentPassword').value,
          newPassword:$('#newPassword').value
        }
      });
      toast('Password updated');
      e.target.reset()
    }catch(err){
      toast(err.message,true)
    }
  };

  $('#deleteAccountForm').onsubmit=async e=>{
    e.preventDefault();
    if(!confirm('Permanently delete your account and projects?'))return;

    try{
      await api('/account',{
        method:'DELETE',
        body:{password:$('#deletePassword').value}
      });
      toast('Account deleted');
      logout()
    }catch(err){
      toast(err.message,true)
    }
  }
}

function adminLogout(){
  atoken='';
  sessionStorage.removeItem('mh_admin');
  adminView()
}

async function adminView(){
  if(!atoken){
    adminShell(`<div class="max-w-md mx-auto py-12">
      <div class="panel p-8">
        <div class="text-center mb-6">
          <div class="w-14 h-14 rounded-2xl grad-bg grid place-items-center text-2xl mx-auto">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <h1 class="text-2xl font-extrabold mt-4">Admin sign in</h1>
          <p class="muted text-sm mt-2">Use the administrator password configured on the server.</p>
        </div>

        <form id="adminLogin" class="space-y-4">
          <input class="field" type="password" id="adminPassword" required autocomplete="current-password" placeholder="Admin password">
          <button class="btn w-full">Sign in securely</button>
        </form>
      </div>
    </div>`);

    $('#adminLogin').onsubmit=async e=>{
      e.preventDefault();
      try{
        const r=await api('/admin/login',{
          method:'POST',
          body:{password:$('#adminPassword').value}
        },null);
        atoken=r.token;
        sessionStorage.setItem('mh_admin',atoken);
        adminView()
      }catch(err){
        toast(err.message,true)
      }
    };
    return
  }

  let d;
  try{
    d=await api('/admin/overview',{},atoken)
  }catch(e){
    if(e.status===401){
      atoken='';
      sessionStorage.removeItem('mh_admin');
      toast('Admin session expired. Please sign in again.',true);
      return adminView()
    }

    adminShell(`<div class="panel p-8 max-w-xl mx-auto text-center">
      <h1 class="text-2xl font-bold">Admin overview unavailable</h1>
      <p class="text-red-300 mt-3">${esc(e.message)}</p>
      <button class="btn mt-5" onclick="adminView()">Retry</button>
    </div>`);
    return
  }

  let st={price:cfg.price,trialDays:cfg.trialDays};
  try{
    st={...st,...await api('/admin/settings',{},atoken)}
  }catch{}

  await checkHealth();

  const s=d.stats||{};
  const stat=(a,b)=>`<div class="panel p-4"><p class="muted text-xs">${a}</p><p class="text-2xl font-extrabold mt-2">${esc(b??0)}</p></div>`;
  const th='text-left text-xs muted py-3 px-3';
  const td='text-sm py-3 px-3 border-t border-[#1e3858]';

  adminShell(`<div class="space-y-7">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <div>
        <p class="text-sm muted">CONTROL CENTER</p>
        <h1 class="text-3xl font-extrabold mt-2">Admin dashboard</h1>
      </div>
      <button class="btn2" onclick="adminView()">
        <i class="fa-solid fa-rotate"></i> Refresh data
      </button>
    </div>

    ${health?.onRender&&!health?.persistent?'<div class="panel p-4 text-amber-200 border-amber-500/40">Warning: configure persistent storage on your hosting platform if your backend requires it to retain accounts and projects after restarts.</div>':''}

    ${health?.requireVerify&&health?.mail==='none'?'<div class="panel p-4 text-amber-200 border-amber-500/40">Email verification is enabled but email delivery is not configured. Configure the mail settings in the server environment.</div>':''}

    <div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-5 gap-3">
      ${stat('Users',s.users)}
      ${stat('Trial',s.trial)}
      ${stat('Paid',s.paid)}
      ${stat('Expired',s.expired)}
      ${stat('Blocked',s.blocked)}
      ${stat('Projects',s.projects)}
      ${stat('Live sites',s.liveSites)}
      ${stat('Running bots',s.runningBots)}
      ${stat('Revenue (KES)',s.revenue)}
      ${stat('Email service',health?.mail||'unknown')}
    </div>

    <section class="panel p-6">
      <h2 class="font-bold text-lg">Pricing and trial settings</h2>
      <p class="muted text-sm mt-1 mb-5">Updates the values supported by your backend.</p>
      <form id="adminSettings" class="grid sm:grid-cols-3 gap-4 items-end">
        <div>
          <label class="muted text-sm">Monthly price (KES)</label>
          <input class="field mt-2" type="number" min="10" max="100000" id="price" required value="${esc(st.price)}">
        </div>
        <div>
          <label class="muted text-sm">Trial days</label>
          <input class="field mt-2" type="number" min="0" max="60" id="trialDays" required value="${esc(st.trialDays)}">
        </div>
        <button class="btn">Save settings</button>
      </form>
    </section>

    <section>
      <h2 class="font-bold text-lg mb-3">Users</h2>
      <div class="panel scroll-table p-3">
        <table class="w-full min-w-[700px]">
          <thead>
            <tr>${['Email','Status','Days left','Projects','Actions'].map(x=>`<th class="${th}">${x}</th>`).join('')}</tr>
          </thead>
          <tbody>
            ${(d.users||[]).map(u=>`<tr>
              <td class="${td}">${esc(u.email)}</td>
              <td class="${td}">${statusBadge(u.status)}</td>
              <td class="${td}">${esc(u.daysLeft)}</td>
              <td class="${td}">${esc(u.projects)}</td>
              <td class="${td}">
                <div class="flex gap-2">
                  ${u.status==='unverified'?`<button class="btn2" onclick="adm('/users/${encodeURIComponent(u.id)}/verify',{})">Verify</button>`:''}
                  <button class="btn2" onclick="adm('/users/${encodeURIComponent(u.id)}/block',{blocked:${!u.blocked}})">${u.blocked?'Unblock':'Block'}</button>
                  <button class="btn2" onclick="adm('/users/${encodeURIComponent(u.id)}/extend',{days:30})">+30 days</button>
                </div>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </section>

    <section>
      <h2 class="font-bold text-lg mb-3">Projects</h2>
      <div class="panel scroll-table p-3">
        <table class="w-full min-w-[700px]">
          <thead>
            <tr>${['Name','Owner','Type','Status','Actions'].map(x=>`<th class="${th}">${x}</th>`).join('')}</tr>
          </thead>
          <tbody>
            ${(d.projects||[]).map(p=>`<tr>
              <td class="${td}">${esc(p.name)}</td>
              <td class="${td}">${esc(p.owner)}</td>
              <td class="${td}">${esc(p.type)}</td>
              <td class="${td}">${statusBadge(p.status)}</td>
              <td class="${td}">
                <div class="flex gap-2">
                  <button class="btn2" onclick="adm('/projects/${encodeURIComponent(p.id)}/suspend',{suspended:${p.suspendedBy!=='admin'}})">${p.suspendedBy==='admin'?'Resume':'Suspend'}</button>
                  <button class="btn2 text-red-300" onclick="if(confirm('Delete this project?'))adm('/projects/${encodeURIComponent(p.id)}',null,'DELETE')">Delete</button>
                </div>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </section>

    <section>
      <h2 class="font-bold text-lg mb-3">Payments</h2>
      <div class="panel scroll-table p-3">
        <table class="w-full min-w-[600px]">
          <thead>
            <tr>${['Date','Email','Amount','Channel'].map(x=>`<th class="${th}">${x}</th>`).join('')}</tr>
          </thead>
          <tbody>
            ${(d.payments||[]).map(p=>`<tr>
              <td class="${td}">${p.at?esc(new Date(p.at).toLocaleString()):'—'}</td>
              <td class="${td}">${esc(p.email)}</td>
              <td class="${td}">KES ${esc(p.amount)}</td>
              <td class="${td}">${esc(p.channel)}</td>
            </tr>`).join('')||`<tr><td class="${td} muted" colspan="4">No payments yet</td></tr>`}
          </tbody>
        </table>
      </div>
    </section>
  </div>`);

  $('#adminSettings').onsubmit=async e=>{
    e.preventDefault();
    try{
      const r=await api('/admin/settings',{
        method:'PUT',
        body:{
          price:$('#price').value,
          trialDays:$('#trialDays').value
        }
      },atoken);
      cfg={...cfg,...r};
      toast('Settings saved');
      adminView()
    }catch(err){
      toast(err.message,true)
    }
  }
}

async function adm(path,body,method='POST'){
  try{
    await api('/admin'+path,{method,body},atoken);
    toast('Admin action completed');
    adminView()
  }catch(e){
    toast(e.message,true)
  }
}

function route(){
  clearInterval(pollT);
  $('#modal').innerHTML='';
  const h=(location.hash||'#/').split('?')[0];
  window.scrollTo(0,0);

  if(token&&(h==='#/login'||h==='#/signup')){
    location.hash='#/dashboard';
    return
  }

  const routes={
    '#/':landing,
    '#/login':()=>authView('login'),
    '#/signup':()=>authView('signup'),
    '#/verify':verifyView,
    '#/dashboard':dashboardView,
    '#/deploy/website':()=>deployView('website'),
    '#/deploy/bot':()=>deployView('bot'),
    '#/github':()=>deployView('github'),
    '#/billing':billingView,
    '#/profile':profileView,
    '#/settings':settingsView,
    '#/admin':adminView
  };

  try{
    (routes[h]||landing)()
  }catch(e){
    console.error(e);
    $('#root').innerHTML=`<main class="max-w-xl mx-auto p-8">
      <div class="panel p-6">
        <h1 class="text-xl font-bold">Something went wrong</h1>
        <p class="muted mt-2">${esc(e.message)}</p>
        <button class="btn mt-4" onclick="route()">Reload page</button>
      </div>
    </main>`
  }
}

window.addEventListener('hashchange',route);
Promise.all([loadCfg(),checkHealth()]).finally(route);
setInterval(checkHealth,60000);
</script>
</body>
</html>
