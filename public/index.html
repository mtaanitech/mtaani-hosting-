  tailwind = {config:{darkMode:'class'}};

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" referrerpolicy="no-referrer">

:root{color-scheme:light dark}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

<div id="root" class="flex flex-col flex-1 min-h-screen"></div>

<script>
'use strict';
/*
 MtaaniHost frontend.
 API routes intentionally retain the routes used by the supplied version.
 Persistent database, admin credentials, deployment workers, and payment verification
 must be implemented securely by the backend; they cannot be made persistent by HTML.
*/
const SUPPORT_WHATSAPP = '';
const API_BASE = (typeof window.MH_API === 'string') ? window.MH_API.replace(/\/$/,'')
  : ((location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? '' : 'https://mtaani-hosting.onrender.com');
let token = safeGet(localStorage,'mh_token');
let atoken = safeGet(sessionStorage,'mh_admin');
let me=null, health=null, pollT=null, logTimer=null, ghKind='website', ghRepos=[];
let cfg={price:130,trialDays:7,human:'math'};
let humanTok='',cfToken='',turnstileWidget=null;
let pendingEmail=safeGet(localStorage,'mh_pending')||'';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeGet(store,key){try{return store.getItem(key)}catch{return null}}
function safeSet(store,key,val){try{store.setItem(key,val)}catch{}}
function safeRemove(store,key){try{store.removeItem(key)}catch{}}
const inp='w-full rounded-lg border border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500';
const btn='grad-bg inline-flex items-center justify-center gap-2 rounded-lg text-white px-4 py-2 text-sm font-semibold hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed';
const btn2='inline-flex items-center justify-center gap-2 rounded-lg border border-gray-300 dark:border-zinc-700 px-3 py-1.5 text-sm hover:bg-emerald-50 dark:hover:bg-zinc-800 hover:border-emerald-500';
const btnDanger='inline-flex items-center justify-center gap-2 rounded-lg border border-red-400 text-red-600 px-3 py-1.5 text-sm hover:bg-red-50 dark:hover:bg-red-500/10';
const card='rounded-2xl border border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-900';
const ddItem='flex w-full items-center gap-3 px-3 py-2 text-sm rounded-lg text-left text-gray-700 dark:text-gray-200 hover:bg-emerald-50 dark:hover:bg-zinc-800 hover:text-emerald-600 cursor-pointer';
const logo='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><defs><linearGradient id="mhLogo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><path d="M12 2 22 20H2L12 2Z" fill="url(#mhLogo)"/><path d="M12 9l4.5 8h-9L12 9Z" fill="#fff" fill-opacity=".9"/></svg>';
function toast(msg,bad=false){const box=$('#toast-container');if(!box)return;const d=document.createElement('div');d.className=`rounded-lg px-4 py-3 text-sm shadow-lg text-white fadein ${bad?'bg-red-600':'bg-emerald-600'}`;d.textContent=String(msg);box.appendChild(d);setTimeout(()=>d.remove(),4500)}
async function api(path,options={},authToken=token){
  const isForm=options.body instanceof FormData;
  const headers={...(options.headers||{})};
  if(!isForm && options.body!==undefined) headers['Content-Type']='application/json';
  if(authToken) headers.Authorization='Bearer '+authToken;
  let response;
  try{response=await fetch(API_BASE+'/api'+path,{...options,headers,body:options.body===undefined?undefined:(isForm?options.body:JSON.stringify(options.body))})}
  catch{throw new Error('Cannot reach the server. Check your internet connection or try again shortly.')}
  const text=await response.text();let data={};
  try{data=text?JSON.parse(text):{}}catch{data={error:text||'The server returned an invalid response.'}}
  if(!response.ok){const e=new Error(data.error||`Request failed (${response.status})`);e.status=response.status;e.data=data;throw e}
  return data;
}
function setTheme(d){document.documentElement.classList.toggle('dark',!!d);safeSet(localStorage,'mh_theme',d?'dark':'light')}
function toggleTheme(){setTheme(!document.documentElement.classList.contains('dark'))}
function logout(){token=null;me=null;safeRemove(localStorage,'mh_token');safeRemove(localStorage,'mh_pending');pendingEmail='';location.hash='#/'}
async function loadCfg(){try{const c=await api('/config',{},null);cfg={...cfg,...c}}catch{}}
async function loadMe(){if(!token)return null;try{me=await api('/me');return me}catch(e){if(e.status===401){token=null;safeRemove(localStorage,'mh_token')}me=null;return null}}
async function requireAuth(){if(await loadMe())return true;if(token){publicShell(`<div class="max-w-md mx-auto px-4 py-24 text-center"><div class="text-4xl mb-3">⏳</div><h1 class="text-xl font-bold mb-2">Server temporarily unavailable</h1><p class="text-sm text-gray-500 mb-6">The server may be starting or your session may have expired.</p><button class="${btn}" onclick="route()">Try again</button></div>`);return false}location.hash='#/login';return false}
function goTo(id){const scroll=()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth'});if(location.hash&&location.hash!=='#/'){location.hash='#/';setTimeout(scroll,180)}else scroll()}
const statusHtml=()=>health===null?'Checking system…':health.ok?'<span class="text-emerald-500">●</span> API online':'<span class="text-red-500">●</span> API unreachable';
async function checkHealth(){try{health=await api('/health',{},null)}catch{health={ok:false}}const el=$('#apiStatus');if(el)el.innerHTML=statusHtml()}
function fmtUp(s){if(!s)return'—';const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`}
function fmtB(b){b=Number(b)||0;return b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(0,Math.round(b/1024))+' KB'}
function badge(s){const colors={live:'emerald',running:'emerald',starting:'amber',stopped:'zinc',suspended:'red',paid:'emerald',trial:'amber',expired:'red'};const c=colors[s]||'zinc';return `<span class="rounded-full px-2 py-0.5 text-xs bg-${c}-500/15 text-${c}-500 border border-${c}-500/30">${esc(s||'unknown')}</span>`}
function headerHtml(mode){
 const themeBtn=`<button type="button" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme" class="h-9 w-9 rounded-full hover:bg-gray-100 dark:hover:bg-zinc-800 grid place-items-center"><i class="fas fa-adjust"></i></button>`;
 const lk='hidden sm:block px-2 text-gray-500 hover:text-gray-900 dark:hover:text-white cursor-pointer text-sm';
 let right='',left='';
 if(mode==='app'){
  left='<button type="button" onclick="toggleSidebar()" class="md:hidden h-9 w-9 grid place-items-center" aria-label="Menu"><i class="fas fa-bars fa-lg"></i></button>';
  const nm=me?.displayName||me?.email||'User';
  right=`${themeBtn}<div class="relative"><button id="settingsBtn" type="button" onclick="toggleSettings(event)" aria-haspopup="true" class="flex items-center gap-2 rounded-full border border-gray-200 dark:border-zinc-700 pl-1 pr-3 py-1"><span class="h-8 w-8 rounded-full grad-bg text-white grid place-items-center text-sm font-bold">${esc(nm[0]?.toUpperCase()||'U')}</span><i class="fas fa-cog text-gray-500"></i></button><div id="settingsDropdown" class="hidden absolute right-0 top-full mt-2 w-64 rounded-xl border border-gray-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 shadow-xl p-2 z-50"><div class="px-3 py-2 mb-1 border-b border-gray-200 dark:border-zinc-700"><div class="font-semibold text-sm truncate">${esc(nm)}</div><div class="text-xs text-gray-500 truncate">${esc(me?.email||'')}</div></div><a class="${ddItem}" href="#/profile"><i class="fas fa-user w-4"></i> My Profile</a><a class="${ddItem}" href="#/settings"><i class="fas fa-cog w-4"></i> Settings</a><a class="${ddItem}" href="#/billing"><i class="fas fa-credit-card w-4"></i> Billing &amp; Payments</a><button type="button" class="${ddItem}" onclick="toggleTheme()"><i class="fas fa-adjust w-4"></i> Switch theme</button><div class="my-1 border-t border-gray-200 dark:border-zinc-700"></div><button type="button" class="${ddItem} !text-red-600" onclick="logout()"><i class="fas fa-sign-out-alt w-4"></i> Logout</button></div></div>`;
 }else if(mode==='admin'){right=`${themeBtn}${atoken?`<button type="button" class="${btn2}" onclick="adminLogout()">Admin logout</button>`:''}<a class="${btn2}" href="#/">Home</a>`}
 else{right=`<a class="${lk}" onclick="goTo('features')">Features</a><a class="${lk}" onclick="goTo('how')">How it works</a><a class="${lk}" onclick="goTo('pricing')">Pricing</a><a class="${lk}" onclick="goTo('faq')">FAQ</a>${themeBtn}${token?`<a class="${btn}" href="#/dashboard">Dashboard</a>`:`<a class="${btn2}" href="#/login">Login</a><a class="${btn}" href="#/signup">Sign up</a>`}`}
 return `<header class="sticky top-0 z-40 backdrop-blur border-b border-gray-200 dark:border-zinc-800 bg-white/85 dark:bg-zinc-950/85"><div class="px-4 h-16 flex items-center justify-between gap-2 ${mode==='public'?'max-w-6xl mx-auto':''}"><div class="flex items-center gap-2">${left}<a href="#/" class="flex items-center gap-2 font-bold text-lg">${logo}<span>Mtaani<span class="grad-text">Host</span></span></a></div><div class="flex items-center gap-2">${right}</div></div></header>`;
}
function footerHtml(){return `<footer class="border-t border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-6 py-10 text-sm text-gray-500"><div class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-8"><div><h4 class="font-semibold text-gray-900 dark:text-gray-100 mb-3">MtaaniHost</h4><p>Tools for deploying websites and bots in Kenya.</p></div><div><h4 class="font-semibold text-gray-900 dark:text-gray-100 mb-3">How it works</h4><ul class="space-y-2"><li>1. Sign up with email</li><li>2. Upload ZIP or import GitHub</li><li>3. Manage your project</li></ul></div><div><h4 class="font-semibold text-gray-900 dark:text-gray-100 mb-3">Pricing</h4><p>KES ${esc(cfg.price)} per month after ${esc(cfg.trialDays)}-day trial, if enabled by the service.</p></div><div><h4 class="font-semibold text-gray-900 dark:text-gray-100 mb-3">Support</h4><ul class="space-y-2"><li><a class="hover:text-emerald-600 cursor-pointer" onclick="goTo('faq')">FAQ</a></li><li><a class="hover:text-emerald-600" href="#/billing">Billing</a></li>${SUPPORT_WHATSAPP?`<li><a class="hover:text-emerald-600" href="https://wa.me/${esc(SUPPORT_WHATSAPP)}" target="_blank" rel="noopener">WhatsApp support</a></li>`:''}<li><a class="hover:text-emerald-600" href="#/admin">Admin</a></li></ul></div></div><div class="mt-8 text-center text-xs">© ${new Date().getFullYear()} MtaaniHost · <span id="apiStatus">${statusHtml()}</span></div></footer>`}
const NAV=[['dashboard','fas fa-layer-group','Projects','#/dashboard'],['deploy-website','fas fa-globe','Deploy Website','#/deploy/website'],['deploy-bot','fas fa-robot','Deploy Bot','#/deploy/bot'],['github','fab fa-github','GitHub Import','#/github'],['billing','fas fa-credit-card','Billing','#/billing'],['profile','fas fa-user','Profile','#/profile'],['settings','fas fa-cog','Settings','#/settings']];
function appShell(active,inner){const items=NAV.map(n=>`<a href="${n[3]}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm ${n[0]===active?'bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 font-semibold':'text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-zinc-800'}"><i class="${n[1]} w-4 text-center"></i>${n[2]}</a>`).join('');$('#root').innerHTML=`${headerHtml('app')}<div class="flex flex-1 min-h-0"><aside id="sidebar" class="fixed md:static top-16 bottom-0 left-0 z-30 w-56 shrink-0 -translate-x-full md:translate-x-0 transition-transform bg-white dark:bg-zinc-900 border-r border-gray-200 dark:border-zinc-800 shadow-lg md:shadow-none"><nav class="p-3 space-y-1">${items}</nav></aside><main class="flex-1 min-w-0 p-4 sm:p-6 fadein">${inner}</main></div>${footerHtml()}`}
function publicShell(inner){$('#root').innerHTML=`${headerHtml('public')}<main class="flex-1 fadein">${inner}</main>${footerHtml()}`}
function adminShell(inner){$('#root').innerHTML=`${headerHtml('admin')}<main class="flex-1 p-4 sm:p-6 fadein">${inner}</main>${footerHtml()}`}
function toggleSidebar(){$('#sidebar')?.classList.toggle('-translate-x-full')}
function toggleSettings(ev){ev?.stopPropagation();$('#settingsDropdown')?.classList.toggle('hidden')}
document.addEventListener('click',e=>{const dd=$('#settingsDropdown');if(dd&&!e.target.closest('#settingsDropdown')&&!e.target.closest('#settingsBtn'))dd.classList.add('hidden')});
function landingPage(){
 return `<div class="hero-bg">
 <section class="max-w-6xl mx-auto px-5 pt-16 pb-20 md:pt-24 md:pb-28 grid md:grid-cols-2 gap-12 items-center">
 <div><div class="inline-flex items-center gap-2 rounded-full border border-emerald-500/30 bg-emerald-500/10 px-3 py-1.5 text-xs text-emerald-600 mb-6"><span class="h-2 w-2 rounded-full bg-emerald-500"></span> Hosting built for your next project</div>
 <h1 class="text-4xl sm:text-5xl md:text-6xl font-black tracking-tight leading-tight">Deploy your ideas.<br><span class="grad-text">Grow from here.</span></h1>
 <p class="mt-6 text-gray-600 dark:text-gray-400 text-base md:text-lg max-w-xl">Host websites and bots from one dashboard. Upload a ZIP or connect GitHub, then manage your projects from anywhere.</p>
 <div class="flex flex-wrap gap-3 mt-8"><a href="#/signup" class="${btn} !px-6 !py-3 glow"><i class="fas fa-rocket"></i> Get started free</a><button class="${btn2} !px-6 !py-3" onclick="goTo('features')">Explore features <i class="fas fa-arrow-down"></i></button></div>
 <div class="mt-8 flex flex-wrap gap-x-6 gap-y-2 text-sm text-gray-500"><span><i class="fas fa-check text-emerald-500 mr-1"></i> Easy deployment</span><span><i class="fas fa-check text-emerald-500 mr-1"></i> Project dashboard</span><span><i class="fas fa-check text-emerald-500 mr-1"></i> Mobile friendly</span></div></div>
 <div class="relative"><div class="absolute inset-8 grad-bg blur-3xl opacity-20 rounded-full"></div><div class="${card} glow relative overflow-hidden"><div class="px-4 py-3 border-b border-gray-200 dark:border-zinc-800 flex items-center gap-2"><span class="h-2.5 w-2.5 rounded-full bg-red-400"></span><span class="h-2.5 w-2.5 rounded-full bg-amber-400"></span><span class="h-2.5 w-2.5 rounded-full bg-emerald-400"></span><span class="ml-2 text-xs text-gray-500">mtaani-dashboard</span></div><div class="p-5 sm:p-7"><div class="flex justify-between items-center mb-6"><div><p class="text-sm text-gray-500">Your projects</p><p class="text-3xl font-bold mt-1">Dashboard</p></div><span class="rounded-lg bg-emerald-500/10 text-emerald-600 px-3 py-2 text-xs"><i class="fas fa-check-circle mr-1"></i> Ready</span></div><div class="space-y-3"><div class="rounded-xl border border-gray-200 dark:border-zinc-800 p-4 flex items-center gap-3"><div class="h-10 w-10 rounded-lg bg-blue-500/10 text-blue-500 grid place-items-center"><i class="fas fa-globe"></i></div><div class="flex-1 min-w-0"><p class="font-semibold text-sm">My website</p><p class="text-xs text-gray-500">Website deployment</p></div>${badge('live')}</div><div class="rounded-xl border border-gray-200 dark:border-zinc-800 p-4 flex items-center gap-3"><div class="h-10 w-10 rounded-lg bg-violet-500/10 text-violet-500 grid place-items-center"><i class="fas fa-robot"></i></div><div class="flex-1 min-w-0"><p class="font-semibold text-sm">My bot</p><p class="text-xs text-gray-500">Bot deployment</p></div>${badge('running')}</div></div><div class="grid grid-cols-2 gap-3 mt-4"><div class="rounded-xl bg-gray-50 dark:bg-zinc-800/60 p-3"><p class="text-xs text-gray-500">Deployments</p><p class="text-xl font-bold mt-1">Simple</p></div><div class="rounded-xl bg-gray-50 dark:bg-zinc-800/60 p-3"><p class="text-xs text-gray-500">Management</p><p class="text-xl font-bold mt-1">One place</p></div></div></div></div></div>
 </section></div>
 <section id="features" class="max-w-6xl mx-auto px-5 py-16"><div class="text-center max-w-2xl mx-auto"><p class="text-emerald-600 text-sm font-semibold uppercase tracking-widest">Features</p><h2 class="text-3xl sm:text-4xl font-black mt-3">Everything you need to <span class="grad-text">get online</span></h2><p class="text-gray-500 mt-4">A straightforward workflow for hosting projects without a complicated setup.</p></div><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-10">
 ${feature('fa-globe','Website hosting','Deploy static websites and supported web applications.')}
 ${feature('fa-robot','Bot hosting','Manage supported bot processes from your dashboard.')}
 ${feature('fa-file-archive','ZIP upload','Upload your project archive and deploy it through the service.')}
 ${feature('fa-code-branch','GitHub import','Connect your GitHub account and choose a repository if configured.')}
 ${feature('fa-terminal','Runtime logs','Inspect project output and troubleshoot supported deployments.')}
 ${feature('fa-sliders-h','Environment settings','Configure project variables when supported by the backend.')}
 </div></section>
 <section id="how" class="bg-gray-100 dark:bg-zinc-900/60 px-5 py-16"><div class="max-w-6xl mx-auto"><div class="text-center"><h2 class="text-3xl font-black">How it works</h2><p class="text-gray-500 mt-3">Get your project ready in three steps.</p></div><div class="grid md:grid-cols-3 gap-5 mt-10">${step(1,'Create your account','Sign up and complete the verification steps.')} ${step(2,'Upload or connect','Choose a ZIP file or import a supported GitHub repository.')} ${step(3,'Manage your project','Use the dashboard to view status and available controls.')}</div></div></section>
 <section id="pricing" class="max-w-5xl mx-auto px-5 py-16"><div class="text-center"><h2 class="text-3xl font-black">Simple pricing</h2><p class="text-gray-500 mt-3">Check the current price and trial terms with the service before subscribing.</p></div><div class="max-w-md mx-auto mt-8 ${card} p-7 glow"><p class="font-semibold">MtaaniHost plan</p><div class="flex items-end gap-2 mt-3"><span class="text-4xl font-black">KES ${esc(cfg.price)}</span><span class="text-gray-500 mb-1">/ month</span></div><p class="text-sm text-gray-500 mt-2">Trial: ${esc(cfg.trialDays)} days, if enabled by the service.</p><ul class="space-y-3 text-sm my-6"><li><i class="fas fa-check text-emerald-500 mr-2"></i>Project dashboard</li><li><i class="fas fa-check text-emerald-500 mr-2"></i>Deployment controls when supported</li><li><i class="fas fa-check text-emerald-500 mr-2"></i>Account and billing management</li></ul><a href="#/signup" class="${btn} w-full">Get started</a></div></section>
 <section id="faq" class="max-w-3xl mx-auto px-5 py-16"><div class="text-center mb-8"><h2 class="text-3xl font-black">Frequently asked questions</h2></div><div class="space-y-3">${faq('How do I deploy a website?','Create an account, open Deploy Website, and follow the upload instructions. The backend must support the selected deployment type.')}${faq('Can I host a bot?','Bot deployment requires a backend worker that can run and supervise your bot process.')}${faq('Can I use GitHub?','GitHub import requires a configured OAuth integration and appropriate repository permissions.')}${faq('Why is the dashboard offline?','The API may be asleep, unavailable, or experiencing an error. Try again later.')}${faq('Is payment enabled?','Payment availability depends on the backend configuration and verified payment integration.')}</div></section>`;
}
function feature(ic,title,desc){return `<div class="${card} lift p-5"><div class="h-11 w-11 rounded-xl bg-emerald-500/10 text-emerald-600 grid place-items-center text-lg mb-4"><i class="fas ${ic}"></i></div><h3 class="font-bold text-lg">${title}</h3><p class="text-sm text-gray-500 mt-2 leading-6">${desc}</p></div>`}
function step(n,title,desc){return `<div class="${card} p-5"><div class="h-10 w-10 rounded-full grad-bg text-white font-bold grid place-items-center">${n}</div><h3 class="font-bold mt-4">${title}</h3><p class="text-sm text-gray-500 mt-2">${desc}</p></div>`}
function faq(q,a){return `<details class="${card} p-4 group"><summary class="cursor-pointer list-none flex justify-between gap-4 font-semibold text-sm">${q}<i class="fas fa-chevron-down text-emerald-500 mt-1"></i></summary><p class="text-sm text-gray-500 mt-3 leading-6">${a}</p></details>`}
function authPage(type){
 const signup=type==='signup';
 const title=signup?'Create your account':'Welcome back';
 const desc=signup?'Start managing your websites and bots.':'Sign in to manage your projects.';
 return `<div class="hero-bg min-h-[75vh] px-4 py-12 flex items-center justify-center"><div class="w-full max-w-md ${card} p-6 sm:p-8 glow"><div class="text-center mb-7"><div class="h-14 w-14 grad-bg rounded-2xl mx-auto grid place-items-center text-white text-2xl mb-4">${logo}</div><h1 class="text-2xl font-black">${title}</h1><p class="text-sm text-gray-500 mt-2">${desc}</p></div>

async function submitAuth(ev,type){
 ev.preventDefault();
 const form=ev.currentTarget,fd=new FormData(form),button=$('#authSubmit');
 const payload={email:String(fd.get('email')||'').trim().toLowerCase(),password:String(fd.get('password')||'')};
 if(type==='signup')payload.displayName=String(fd.get('displayName')||'').trim();
 button.disabled=true;button.innerHTML='<i class="fas fa-spinner fa-spin"></i> Please wait…';
 try{
  const result=await api(type==='signup'?'/auth/signup':'/auth/login',{method:'POST',body:payload},null);
  if(result.token){
   token=result.token;safeSet(localStorage,'mh_token',token);safeRemove(localStorage,'mh_pending');pendingEmail='';
   await loadMe();toast(type==='signup'?'Account created.':'Welcome back!');location.hash='#/dashboard';return;
  }
  if(result.requiresVerification||result.pendingVerification){
   pendingEmail=payload.email;safeSet(localStorage,'mh_pending',pendingEmail);
   toast(result.message||'Check your email for a verification code.');location.hash='#/verify';return;
  }
  toast(result.message||'Request completed, but no login token was returned.',true);
 }catch(e){toast(e.message||'Authentication failed.',true)}
 finally{if(button){button.disabled=false;button.innerHTML=`<i class="fas ${type==='signup'?'fa-user-plus':'fa-sign-in-alt'}"></i> ${type==='signup'?'Create account':'Sign in'}`}}
}

async function saveEnv(ev,id){
 ev.preventDefault();const envText=new FormData(ev.currentTarget).get('env');const env={};
 String(envText||'').split(/\r?\n/).forEach(line=>{const i=line.indexOf('=');if(i>0)env[line.slice(0,i).trim()]=line.slice(i+1).trim()});
 try{const r=await api('/projects/'+encodeURIComponent(id)+'/env',{method:'PUT',body:{env}});toast(r.message||'Environment variables saved.')}
 catch(e){toast(e.message,true)}
}

async function submitDeploy(ev,type){
 ev.preventDefault();const form=ev.currentTarget,fd=new FormData(form),file=fd.get('file'),name=String(fd.get('name')||'').trim(),button=$('#deployBtn');
 if(!(file instanceof File)||!file.name.toLowerCase().endsWith('.zip')){toast('Please choose a ZIP file.',true);return}
 const body=new FormData();body.append('name',name);body.append('type',type);body.append('runtime',String(fd.get('runtime')||'auto'));body.append('file',file);
 if(fd.get('startCommand'))body.append('startCommand',String(fd.get('startCommand')));
 const env={};String(fd.get('env')||'').split(/\r?\n/).forEach(line=>{const i=line.indexOf('=');if(i>0)env[line.slice(0,i).trim()]=line.slice(i+1).trim()});
 body.append('env',JSON.stringify(env));
 button.disabled=true;button.innerHTML='<i class="fas fa-spinner fa-spin"></i> Uploading…';
 try{
  const r=await api('/projects/deploy',{method:'POST',body});
  $('#deployResult').innerHTML=`<div class="rounded-xl border border-emerald-500/30 bg-emerald-500/10 p-4"><p class="font-semibold text-emerald-600"><i class="fas fa-check-circle mr-2"></i>${esc(r.message||'Deployment request submitted')}</p>${r.project?.url?`<a target="_blank" rel="noopener" class="text-sm underline break-all mt-2 inline-block" href="${esc(r.project.url)}">${esc(r.project.url)}</a>`:''}<a href="#/dashboard" class="text-sm text-emerald-600 underline block mt-3">Go to dashboard</a></div>`;
  toast(r.message||'Deployment request submitted.');
 }catch(e){toast(e.message,true);$('#deployResult').innerHTML=`<p class="text-sm text-red-500 mt-3">${esc(e.message)}</p>`}
 finally{button.disabled=false;button.innerHTML='<i class="fas fa-rocket"></i> Deploy project'}
}

}
function profilePage(){
 return `<div class="max-w-3xl mx-auto"><div class="mb-7"><h1 class="text-2xl sm:text-3xl font-black">My profile</h1><p class="text-sm text-gray-500 mt-2">View and update your account details.</p></div><div class="${card} p-6"><div class="flex items-center gap-4 mb-7"><div class="h-14 w-14 rounded-full grad-bg text-white text-xl font-bold grid place-items-center">${esc((me?.displayName||me?.email||'U')[0].toUpperCase())}</div><div><h2 class="font-bold">${esc(me?.displayName||'User')}</h2><p class="text-sm text-gray-500">${esc(me?.email||'')}</p></div></div><form onsubmit="saveProfile(event)" class="space-y-4"><div><label class="block text-sm font-semibold mb-1">Display name</label><input class="${inp}" name="displayName" maxlength="80" required value="${esc(me?.displayName||'')}"></div><div><label class="block text-sm font-semibold mb-1">Email</label><input class="${inp}" value="${esc(me?.email||'')}" disabled></div><button class="${btn}">Save profile</button></form><div class="border-t border-gray-200 dark:border-zinc-800 mt-7 pt-6"><h3 class="font-bold text-red-600">Danger zone</h3><p class="text-sm text-gray-500 mt-2">Account deletion may permanently remove your account and projects.</p><button class="${btnDanger} mt-4" onclick="deleteAccount()">Delete my account</button></div></div></div>`;
}
async function saveProfile(ev){
 ev.preventDefault();const displayName=new FormData(ev.currentTarget).get('displayName');
 try{const r=await api('/me',{method:'PATCH',body:{displayName:String(displayName).trim()}});await loadMe();toast(r.message||'Profile updated.');location.hash='#/profile'}
 catch(e){toast(e.message,true)}
}
async function deleteAccount(){
 const phrase=prompt('Type DELETE to confirm account deletion.');
 if(phrase!=='DELETE')return;
 try{const r=await api('/me',{method:'DELETE',body:{confirm:'DELETE'}});toast(r.message||'Account deletion requested.');logout()}
 catch(e){toast(e.message,true)}
}
function settingsPage(){
 return `<div class="max-w-3xl mx-auto"><div class="mb-7"><h1 class="text-2xl sm:text-3xl font-black">Settings</h1><p class="text-sm text-gray-500 mt-2">Customize your dashboard.</p></div><div class="${card} p-6 space-y-6"><div class="flex items-center justify-between gap-4"><div><h2 class="font-semibold">Appearance</h2><p class="text-sm text-gray-500 mt-1">Switch between light and dark themes.</p></div><button class="${btn2}" onclick="toggleTheme()">Toggle theme</button></div><div class="border-t border-gray-200 dark:border-zinc-800 pt-5 flex items-center justify-between gap-4"><div><h2 class="font-semibold">Session</h2><p class="text-sm text-gray-500 mt-1">Sign out from this device.</p></div><button class="${btnDanger}" onclick="logout()">Log out</button></div><div class="border-t border-gray-200 dark:border-zinc-800 pt-5"><h2 class="font-semibold">Service connection</h2><p class="text-sm text-gray-500 mt-1">Current API: <span class="break-all">${esc(API_BASE||'Same origin')}</span></p><p class="text-sm mt-3" id="apiStatus">${statusHtml()}</p><button class="${btn2} mt-3" onclick="checkHealth()">Check connection</button></div></div></div>`;
}
async function loadPaymentsOnRoute(){await loadPayments()}
function adminLoginPage(){
 return `<div class="min-h-[70vh] flex items-center justify-center p-4"><div class="${card} w-full max-w-md p-7"><h1 class="text-2xl font-black">Admin access</h1><p class="text-sm text-gray-500 mt-2 mb-5">Sign in with an admin account configured on the server.</p><form onsubmit="adminLogin(event)" class="space-y-4"><input class="${inp}" name="email" type="email" required placeholder="Admin email"><input class="${inp}" name="password" type="password" required placeholder="Admin password"><button class="${btn} w-full">Sign in</button></form></div></div>`;
}
async function adminLogin(ev){
 ev.preventDefault();const fd=new FormData(ev.currentTarget);
 try{const r=await api('/admin/login',{method:'POST',body:{email:fd.get('email'),password:fd.get('password')}},null);atoken=r.token;if(!atoken)throw new Error('Server did not return an admin token.');safeSet(sessionStorage,'mh_admin',atoken);toast('Admin login successful.');location.hash='#/admin/dashboard'}
 catch(e){toast(e.message,true)}
}
function adminLogout(){atoken=null;safeRemove(sessionStorage,'mh_admin');location.hash='#/admin'}
async function adminDashboard(){
 if(!atoken){adminShell(adminLoginPage());return}
 adminShell(`<div class="max-w-6xl mx-auto"><h1 class="text-3xl font-black">Admin dashboard</h1><p class="text-sm text-gray-500 mt-2 mb-6">Server-reported account and service information.</p><div class="grid sm:grid-cols-2 gap-4"><div class="${card} p-5"><h2 class="font-bold">Service overview</h2><div id="adminStats" class="mt-4 text-sm text-gray-500">Loading…</div><button class="${btn2} mt-4" onclick="loadAdminStats()">Refresh</button></div><div class="${card} p-5"><h2 class="font-bold">Pricing configuration</h2><p class="text-sm text-gray-500 mt-2">Change pricing only if the backend supports the configuration route.</p><form onsubmit="saveAdminConfig(event)" class="space-y-3 mt-4"><input class="${inp}" name="price" type="number" min="0" required value="${esc(cfg.price)}" placeholder="Monthly price in KES"><input class="${inp}" name="trialDays" type="number" min="0" max="365" required value="${esc(cfg.trialDays)}" placeholder="Trial days"><button class="${btn}">Save configuration</button></form></div></div></div>`);
 await loadAdminStats();
}
async function loadAdminStats(){
 const el=$('#adminStats');if(!el)return;el.textContent='Loading…';
 try{const r=await api('/admin/stats',{},atoken);el.innerHTML=Object.entries(r.stats||r).map(([k,v])=>`<div class="flex justify-between gap-3 py-2 border-b border-gray-200 dark:border-zinc-800"><span>${esc(k)}</span><strong>${esc(typeof v==='object'?JSON.stringify(v):v)}</strong></div>`).join('')}
 catch(e){el.textContent=e.message}
}
async function saveAdminConfig(ev){
 ev.preventDefault();const fd=new FormData(ev.currentTarget);
 try{const r=await api('/admin/config',{method:'PATCH',body:{price:Number(fd.get('price')),trialDays:Number(fd.get('trialDays'))}},atoken);cfg={...cfg,...r.config};toast(r.message||'Configuration saved.')}
 catch(e){toast(e.message,true)}
}
function route(){
 const raw=location.hash.replace(/^#\/?/,'');
 const parts=raw.split('/').filter(Boolean);
 const page=parts[0]||'';
 const sub=parts[1]||'';
if(pollT){clearInterval(pollT);pollT=null}
 if(logTimer){clearInterval(logTimer);logTimer=null}
if(page==='login'){publicShell(authPage('login'));return}
 if(page==='signup'){publicShell(authPage('signup'));return}
 if(page==='verify'){publicShell(verifyPage());return}
 if(page==='forgot'){publicShell(forgotPage());return}
 if(page==='admin'){
  if(sub==='dashboard'){adminDashboard();return}
  adminShell(adminLoginPage());return
 }
 if(page==='github/callback'||(page==='github'&&location.search)){
  githubCallback();return
 }
 if(page===''){
  publicShell(landingPage());checkHealth();return
 }
if(!token){
  location.hash='#/login';return
 }
if(page==='dashboard'){
if(!me){
publicShell("<div class="p-12 text-center"> <h2 class="text-xl font-bold mb-3">Dashboard connection</h2> <p class="text-sm text-gray-500 mb-5"> Unable to load your account. Please try again. </p> <button class="${btn}" onclick="retryDashboard()"> Try again </button> <button class="${btn2} ml-2" onclick="logout()"> Login again </button> </div>");
return;
}
appShell('dashboard',dashboardPage());
checkHealth();
return;
  }
 if(page==='deploy'&&(sub==='website'||sub==='bot')){
  appShell('deploy-'+sub,deployPage(sub));return
 }
 if(page==='github'){
  githubPage();return
 }
 if(page==='billing'){
  if(!me){loadMe().then(()=>route());return}
  appShell('billing',billingPage());loadPayments();return
 }
 if(page==='profile'){
  if(!me){loadMe().then(()=>route());return}
  appShell('profile',profilePage());return
 }
 if(page==='settings'){
  appShell('settings',settingsPage());checkHealth();return
 }
 location.hash='#/dashboard';
}
async function githubCallback(){
 try{
  const params=new URLSearchParams(location.search);
  const code=params.get('code'),state=params.get('state');
  if(!code){toast('GitHub authorization code is missing.',true);location.hash='#/github';return}
  const r=await api('/github/callback',{method:'POST',body:{code,state}});
  toast(r.message||'GitHub connected.');
  history.replaceState(null,'',location.pathname+'#/github');
  location.hash='#/github';
 }catch(e){toast(e.message,true);location.hash='#/github'}
}
window.addEventListener('hashchange',route);
window.addEventListener('storage',e=>{
 if(e.key==='mh_token'){token=safeGet(localStorage,'mh_token');loadMe().then(route)}
});
async function boot(){
 setTheme(safeGet(localStorage,'mh_theme')==='dark');
 await loadCfg();
 if(token)await loadMe();
 route();
}
boot();
</script>
