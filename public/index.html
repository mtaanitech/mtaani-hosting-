<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090b">
  <title>MtaaniHost V2 — Web Hosting</title>
  <meta name="description" content="Deploy and manage your web projects with MtaaniHost V2.">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #09090b;
      --panel: #111114;
      --border: #27272a;
      --green: #4ade80;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: #f4f4f5;
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }

    button, input, select { font: inherit; }

    button { cursor: pointer; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 17px;
      border-radius: 10px;
      background: var(--green);
      color: #052e16;
      font-weight: 800;
      border: 0;
    }

    .btn:hover { background: #86efac; }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 15px;
      border-radius: 10px;
      border: 1px solid #3f3f46;
      color: #f4f4f5;
      background: #18181b;
    }

    .field {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #3f3f46;
      border-radius: 10px;
      color: white;
      background: #09090b;
      outline: none;
    }

    .field:focus { border-color: var(--green); }

    .muted { color: #a1a1aa; }

    .nav-link {
      display: block;
      width: 100%;
      padding: 11px 12px;
      border-radius: 9px;
      text-align: left;
      color: #d4d4d8;
      background: transparent;
      border: 0;
    }

    .nav-link:hover, .nav-link.active {
      background: #27272a;
      color: var(--green);
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 7px;
    }

    #toast {
      position: fixed;
      z-index: 100;
      right: 16px;
      bottom: 16px;
      max-width: calc(100% - 32px);
      background: #27272a;
      border: 1px solid #52525b;
      padding: 13px 16px;
      border-radius: 12px;
      display: none;
    }

    .loader {
      width: 22px;
      height: 22px;
      border: 3px solid #3f3f46;
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div id="app">
    <div class="min-h-screen flex items-center justify-center p-6">
      <div class="text-center">
        <div class="loader mx-auto mb-4"></div>
        <p class="muted">Loading MtaaniHost V2...</p>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    /*
      CONFIGURATION

      Set API_BASE to your actual backend URL.
      Example:
      const API_BASE = "https://your-backend.example.com";

      Leave empty if this frontend is hosted by the same server
      that provides the API.
    */
    const API_BASE = "";

    const app = document.getElementById("app");
    const toastBox = document.getElementById("toast");

    let currentPage = "home";
    let currentUser = null;
    let projects = [];
    let apiStatus = "Checking";
    let toastTimer = null;

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function (char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char];
      });
    }

    function showToast(message) {
      toastBox.textContent = message;
      toastBox.style.display = "block";

      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toastBox.style.display = "none";
      }, 3500);
    }

    function getToken() {
      return sessionStorage.getItem("mt_host_token") || "";
    }

    function saveSession(user, token) {
      currentUser = user || null;

      if (token) {
        sessionStorage.setItem("mt_host_token", token);
      }

      if (user) {
        sessionStorage.setItem("mt_host_user", JSON.stringify(user));
      }
    }

    function restoreSession() {
      try {
        const saved = sessionStorage.getItem("mt_host_user");
        currentUser = saved ? JSON.parse(saved) : null;
      } catch (error) {
        currentUser = null;
        sessionStorage.removeItem("mt_host_user");
      }
    }

    async function api(path, options = {}) {
      const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
      };

      const token = getToken();

      if (token) {
        headers.Authorization = "Bearer " + token;
      }

      const response = await fetch(API_BASE + path, {
        ...options,
        headers
      });

      const contentType = response.headers.get("content-type") || "";
      let data = {};

      if (contentType.includes("application/json")) {
        data = await response.json();
      } else {
        const text = await response.text();
        data = { message: text };
      }

      if (!response.ok) {
        throw new Error(
          data.message ||
          data.error ||
          "Request failed (" + response.status + ")"
        );
      }

      return data;
    }

    async function checkHealth() {
      apiStatus = "Checking";

      try {
        const result = await api("/health");
        apiStatus = "Online";
        return result;
      } catch (error) {
        apiStatus = "Unavailable";
        return null;
      }
    }

    function navigate(page) {
      currentPage = page;
      window.location.hash = page;
      render();
    }

    function publicHeader() {
      return `
        <header class="border-b border-zinc-800">
          <div class="max-w-7xl mx-auto px-5 py-4 flex items-center justify-between gap-4">
            <button onclick="navigate('home')" class="flex items-center gap-3">
              <span class="w-10 h-10 rounded-xl bg-green-400 text-black font-black flex items-center justify-center">M</span>
              <span class="text-lg font-black">Mtaani<span class="text-green-400">Host</span></span>
            </button>

            <nav class="flex items-center gap-3">
              <button class="btn-secondary" onclick="navigate('login')">Login</button>
              <button class="btn" onclick="navigate('register')">Get started</button>
            </nav>
          </div>
        </header>
      `;
    }

    function homePage() {
      return `
        ${publicHeader()}

        <main>
          <section class="max-w-7xl mx-auto px-5 pt-20 pb-24 md:pt-28">
            <div class="max-w-3xl">
              <div class="inline-flex items-center gap-2 border border-zinc-700 rounded-full px-4 py-2 text-sm muted mb-8">
                <span class="status-dot"></span>
                Your projects, one platform
              </div>

              <h1 class="text-4xl md:text-7xl font-black tracking-tight leading-tight">
                Build it.<br>
                Deploy it.<br>
                <span class="text-green-400">Own your web.</span>
              </h1>

              <p class="text-lg md:text-xl muted mt-6 max-w-2xl leading-8">
                Manage your web projects from one simple dashboard.
                Keep your deployments and project information organized.
              </p>

              <div class="flex flex-wrap gap-3 mt-9">
                <button class="btn" onclick="navigate('register')">
                  Start building <span aria-hidden="true">→</span>
                </button>
                <button class="btn-secondary" onclick="navigate('login')">
                  Open dashboard
                </button>
              </div>
            </div>

            <div class="grid md:grid-cols-3 gap-4 mt-20">
              <div class="panel p-6">
                <div class="text-2xl mb-4">⚡</div>
                <h2 class="font-bold text-lg">Simple workflow</h2>
                <p class="muted text-sm leading-6 mt-2">
                  Keep your project management straightforward.
                </p>
              </div>

              <div class="panel p-6">
                <div class="text-2xl mb-4">◈</div>
                <h2 class="font-bold text-lg">Project dashboard</h2>
                <p class="muted text-sm leading-6 mt-2">
                  Access your projects from one place.
                </p>
              </div>

              <div class="panel p-6">
                <div class="text-2xl mb-4">⌘</div>
                <h2 class="font-bold text-lg">API connection</h2>
                <p class="muted text-sm leading-6 mt-2">
                  Connect your frontend to your hosting API.
                </p>
              </div>
            </div>
          </section>
        </main>

        <footer class="border-t border-zinc-800">
          <div class="max-w-7xl mx-auto px-5 py-7 muted text-sm">
            © ${new Date().getFullYear()} MtaaniHost V2
          </div>
        </footer>
      `;
    }

    function authPage(register = false) {
      return `
        ${publicHeader()}

        <main class="max-w-md mx-auto px-5 py-16">
          <div class="panel p-7">
            <button class="muted text-sm mb-6" onclick="navigate('home')">← Back home</button>

            <h1 class="text-3xl font-black">
              ${register ? "Create account" : "Welcome back"}
            </h1>

            <p class="muted mt-2 mb-7">
              ${register ? "Get started with MtaaniHost." : "Login to your account."}
            </p>

            <form id="auth-form" onsubmit="submitAuth(event, ${register})">
              ${register ? `
                <label class="block text-sm mb-2" for="auth-name">Full name</label>
                <input class="field mb-4" id="auth-name" name="name"
                  autocomplete="name" required maxlength="100"
                  placeholder="Your name">
              ` : ""}

              <label class="block text-sm mb-2" for="auth-email">Email</label>
              <input class="field mb-4" id="auth-email" name="email"
                type="email" autocomplete="email" required
                placeholder="you@example.com">

              <label class="block text-sm mb-2" for="auth-password">Password</label>
              <input class="field mb-6" id="auth-password" name="password"
                type="password" autocomplete="${register ? "new-password" : "current-password"}"
                required minlength="6" placeholder="Enter password">

              <button id="auth-submit" class="btn w-full" type="submit">
                ${register ? "Create account" : "Login"}
              </button>
            </form>

            <p class="text-sm muted mt-6 text-center">
              ${register ? "Already have an account?" : "New to MtaaniHost?"}
              <button class="text-green-400 font-bold"
                onclick="navigate('${register ? "login" : "register"}')">
                ${register ? "Login" : "Create account"}
              </button>
            </p>

            <p id="auth-error" class="text-red-400 text-sm mt-4" role="alert"></p>
          </div>
        </main>
      `;
    }

    async function submitAuth(event, register) {
      event.preventDefault();

      const form = document.getElementById("auth-form");
      const submitButton = document.getElementById("auth-submit");
      const errorBox = document.getElementById("auth-error");
      const formData = new FormData(form);

      const payload = {
        email: String(formData.get("email") || "").trim(),
        password: String(formData.get("password") || "")
      };

      if (register) {
        payload.name = String(formData.get("name") || "").trim();
      }

      submitButton.disabled = true;
      submitButton.textContent = "Please wait...";
      errorBox.textContent = "";

      /*
        These endpoint names must match your backend.
        If your API uses different routes or payload fields,
        update them to match the actual backend.
      */
      const endpoint = register ? "/api/auth/register" : "/api/auth/login";

      try {
        const result = await api(endpoint, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const token =
          result.token ||
          result.accessToken ||
          (result.data && (result.data.token || result.data.accessToken));

        const user =
          result.user ||
          result.data?.user ||
          { email: payload.email, name: payload.name || "" };

        if (!token && !register) {
          throw new Error("Login response did not include an authentication token. Check your API response format.");
        }

        if (register && !token) {
          showToast("Account created. Please login.");
          navigate("login");
          return;
        }

        saveSession(user, token);
        showToast("Welcome to MtaaniHost!");
        navigate("dashboard");
      } catch (error) {
        errorBox.textContent = error.message ||
          "Unable to connect. Check your backend API settings.";
      } finally {
        const button = document.getElementById("auth-submit");

        if (button) {
          button.disabled = false;
          button.textContent = register ? "Create account" : "Login";
        }
      }
    }

    function appShell(content) {
      return `
        <div class="min-h-screen md:flex">
          <aside class="md:w-64 border-b md:border-b-0 md:border-r border-zinc-800 p-5">
            <button onclick="navigate('dashboard')" class="flex items-center gap-3 mb-8">
              <span class="w-10 h-10 rounded-xl bg-green-400 text-black font-black flex items-center justify-center">M</span>
              <span class="font-black text-lg">MtaaniHost</span>
            </button>

            <nav class="space-y-2">
              <button class="nav-link ${currentPage === "dashboard" ? "active" : ""}"
                onclick="navigate('dashboard')">▦ &nbsp; Overview</button>

              <button class="nav-link ${currentPage === "projects" ? "active" : ""}"
                onclick="navigate('projects')">◈ &nbsp; Projects</button>

              <button class="nav-link ${currentPage === "settings" ? "active" : ""}"
                onclick="navigate('settings')">⚙ &nbsp; Settings</button>

              <button class="nav-link" onclick="logout()">↪ &nbsp; Logout</button>
            </nav>

            <div class="panel p-4 mt-8">
              <p class="text-sm font-bold">API status</p>
              <p class="muted text-sm mt-2">
                <span class="status-dot" style="background:${apiStatus === "Online" ? "#4ade80" : apiStatus === "Unavailable" ? "#f87171" : "#facc15"}"></span>
                ${escapeHTML(apiStatus)}
              </p>
              <button class="text-green-400 text-sm mt-3" onclick="refreshDashboard()">
                Check connection
              </button>
            </div>
          </aside>

          <main class="flex-1 min-w-0 p-5 md:p-9">
            <header class="flex flex-wrap items-center justify-between gap-4 mb-8">
              <div>
                <p class="muted text-sm">MtaaniHost V2 / ${escapeHTML(currentPage)}</p>
                <h1 class="text-2xl md:text-3xl font-black mt-1">
                  ${currentPage === "projects" ? "Your projects" : currentPage === "settings" ? "Settings" : "Dashboard"}
                </h1>
              </div>

              <div class="panel px-4 py-3 text-sm">
                ${escapeHTML(currentUser?.name || currentUser?.email || "Account")}
              </div>
            </header>

            ${content}
          </main>
        </div>
      `;
    }

    function dashboardPage() {
      return `
        <section class="panel p-6 md:p-8">
          <p class="muted text-sm">Welcome to your workspace</p>
          <h2 class="text-2xl md:text-3xl font-black mt-2">
            Hello, ${escapeHTML(currentUser?.name || "Developer")} 👋
          </h2>
          <p class="muted mt-3 max-w-2xl leading-7">
            Manage your web projects and check your hosting API connection here.
          </p>

          <div class="flex flex-wrap gap-3 mt-6">
            <button class="btn" onclick="navigate('projects')">View projects →</button>
            <button class="btn-secondary" onclick="refreshDashboard()">Refresh status</button>
          </div>
        </section>

        <section class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4 mt-6">
          <div class="panel p-5">
            <p class="muted text-sm">Projects in this session</p>
            <p class="text-3xl font-black mt-3">${projects.length}</p>
          </div>

          <div class="panel p-5">
            <p class="muted text-sm">API status</p>
            <p class="text-2xl font-black mt-3">${escapeHTML(apiStatus)}</p>
          </div>

          <div class="panel p-5">
            <p class="muted text-sm">Account</p>
            <p class="text-lg font-bold mt-3 break-words">
              ${escapeHTML(currentUser?.email || "Signed in")}
            </p>
          </div>
        </section>

        <section class="panel p-6 mt-6">
          <div class="flex items-center justify-between gap-3 flex-wrap">
            <h2 class="font-bold text-lg">Recent projects</h2>
            <button class="btn-secondary" onclick="navigate('projects')">Manage projects</button>
          </div>
          ${projectList(3)}
        </section>
      `;
    }

    function projectList(limit = 100) {
      if (!projects.length) {
        return `
          <div class="text-center py-10">
            <div class="text-3xl mb-3">◈</div>
            <h3 class="font-bold">No projects yet</h3>
            <p class="muted text-sm mt-2">Add a project to get started.</p>
          </div>
        `;
      }

      return `
        <div class="space-y-3 mt-5">
          ${projects.slice(0, limit).map(function (project) {
            return `
              <div class="border border-zinc-800 rounded-xl p-4 flex flex-wrap justify-between items-center gap-3">
                <div class="min-w-0">
                  <h3 class="font-bold break-words">${escapeHTML(project.name)}</h3>
                  <p class="muted text-sm mt-1 break-all">${escapeHTML(project.url || "No URL added")}</p>
                </div>
                <button class="btn-secondary" onclick="deleteProject('${escapeHTML(project.id)}')">
                  Remove
                </button>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function projectsPage() {
      return `
        <section class="panel p-6">
          <h2 class="font-bold text-lg">Add a project</h2>
          <p class="muted text-sm mt-2">Save project details in this browser session.</p>

          <form class="grid md:grid-cols-2 gap-3 mt-5"
            onsubmit="addProject(event)">
            <input class="field" name="projectName" required maxlength="100"
              placeholder="Project name">
            <input class="field" name="projectUrl" type="url"
              placeholder="https://example.com">
            <button class="btn md:col-span-2" type="submit">Add project</button>
          </form>
        </section>

        <section class="panel p-6 mt-6">
          <h2 class="font-bold text-lg">All projects</h2>
          ${projectList()}
        </section>
      `;
    }

    function addProject(event) {
      event.preventDefault();

      const formData = new FormData(event.currentTarget);
      const name = String(formData.get("projectName") || "").trim();
      const url = String(formData.get("projectUrl") || "").trim();

      if (!name) {
        showToast("Enter a project name.");
        return;
      }

      projects.unshift({
        id: String(Date.now()),
        name: name,
        url: url
      });

      render();
      showToast("Project added for this session.");
    }

    function deleteProject(id) {
      projects = projects.filter(function (project) {
        return project.id !== id;
      });

      render();
      showToast("Project removed.");
    }

    function settingsPage() {
      return `
        <section class="panel p-6">
          <h2 class="font-bold text-lg">Account information</h2>

          <div class="mt-5">
            <p class="muted text-sm">Name</p>
            <p class="mt-1">${escapeHTML(currentUser?.name || "Not provided")}</p>
          </div>

          <div class="mt-5">
            <p class="muted text-sm">Email</p>
            <p class="mt-1 break-words">${escapeHTML(currentUser?.email || "Not provided")}</p>
          </div>

          <div class="mt-6 border-t border-zinc-800 pt-5">
            <h3 class="font-bold">Backend connection</h3>
            <p class="muted text-sm mt-2">Configured API base: ${escapeHTML(API_BASE || "Same origin")}</p>
            <p class="muted text-sm mt-2">Health endpoint: ${escapeHTML((API_BASE || "") + "/health")}</p>
            <button class="btn mt-4" onclick="refreshDashboard()">Test API</button>
          </div>
        </section>
      `;
    }

    async function refreshDashboard() {
      await checkHealth();

      if (currentPage === "dashboard" && currentUser) {
        render();
      } else {
        showToast("API status: " + apiStatus);
      }
    }

    function logout() {
      sessionStorage.removeItem("mt_host_token");
      sessionStorage.removeItem("mt_host_user");
      currentUser = null;
      currentPage = "home";
      window.location.hash = "home";
      render();
      showToast("You have been logged out.");
    }

    function route() {
      const requested = window.location.hash.replace(/^#\/?/, "").split("?")[0];
      const allowed = ["home", "login", "register", "dashboard", "projects", "settings"];

      currentPage = allowed.includes(requested) ? requested : "home";

      if (["dashboard", "projects", "settings"].includes(currentPage)) {
        if (!currentUser || !getToken()) {
          currentPage = "login";
        }
      }

      render();
    }

    function render() {
      try {
        if (currentPage === "home") {
          app.innerHTML = homePage();
          return;
        }

        if (currentPage === "login") {
          app.innerHTML = authPage(false);
          return;
        }

        if (currentPage === "register") {
          app.innerHTML = authPage(true);
          return;
        }

        if (currentPage === "dashboard") {
          if (!currentUser) {
            currentPage = "login";
            app.innerHTML = authPage(false);
            return;
          }

          app.innerHTML = appShell(dashboardPage());
          checkHealth().then(function () {
            if (currentPage === "dashboard") render();
          });
          return;
        }

        if (currentPage === "projects") {
          app.innerHTML = appShell(projectsPage());
          return;
        }

        if (currentPage === "settings") {
          app.innerHTML = appShell(settingsPage());
          return;
        }

        currentPage = "home";
        app.innerHTML = homePage();
      } catch (error) {
        console.error("MtaaniHost render error:", error);

        app.innerHTML = `
          <main class="min-h-screen flex items-center justify-center p-6">
            <section class="panel p-7 max-w-lg w-full">
              <h1 class="text-2xl font-black text-red-400">Page error</h1>
              <p class="muted mt-3">The page could not be rendered.</p>
              <button class="btn mt-5" onclick="navigate('home')">Back to home</button>
            </section>
          </main>
        `;
      }
    }

    window.addEventListener("hashchange", route);

    window.addEventListener("error", function (event) {
      console.error("JavaScript error:", event.message);
    });

    restoreSession();
    route();
  </script>
</body>
  </html>
