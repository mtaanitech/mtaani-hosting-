<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#09090b" />
<title>MtaaniHost — Deploy from GitHub in seconds</title>
<meta name="description" content="Host your website, web app or bot from GitHub. Free for 14 days, then KES 70 per month. Pay with M-Pesa.">
<script>
  tailwind = { config: { darkMode: 'class' } };
  try {
    if (localStorage.getItem('mh_theme') !== 'light') {
      document.documentElement.classList.add('dark');
    }
  } catch (_) {
    document.documentElement.classList.add('dark');
  }
</script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    width: 100%;
    min-width: 0;
  }
  button, input, textarea, select { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  img, svg, video { max-width: 100%; }
  .grad-text {
    background: linear-gradient(90deg,#34d399,#22d3ee 50%,#a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .grid-bg {
    background-image: linear-gradient(to right,rgba(113,113,122,.14) 1px,transparent 1px),linear-gradient(to bottom,rgba(113,113,122,.14) 1px,transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 0,#000 40%,transparent 75%);
    mask-image: radial-gradient(ellipse at 50% 0,#000 40%,transparent 75%);
  }
  .glow { box-shadow: 0 0 80px -20px rgba(52,211,153,.35); }
  .lift { transition: border-color .18s, transform .18s, box-shadow .18s; }
  .lift:hover { border-color: rgba(52,211,153,.6); transform: translateY(-2px); }
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .fadein { animation: fadein .2s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  details > summary::-webkit-details-marker { display: none; }
  .logs span.cmd { color: #34d399; }
  .logs span.err { color: #f87171; }
  .logs span.ok { color: #4ade80; }
  .logs span.dim { color: #71717a; }

  /* Mobile-first navigation */
  .mobile-nav {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 55;
    background: rgba(0,0,0,.58);
    backdrop-filter: blur(5px);
  }
  .mobile-nav.open { display: block; }
  .mobile-nav-panel {
    position: absolute;
    top: 0;
    right: 0;
    width: min(86vw, 340px);
    height: 100%;
    overflow-y: auto;
    background: #fff;
    color: #18181b;
    border-left: 1px solid #e4e4e7;
    padding: max(18px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom));
    animation: slidein .18s ease;
  }
  .dark .mobile-nav-panel {
    background: #09090b;
    color: #f4f4f5;
    border-color: #27272a;
  }
  @keyframes slidein { from { transform: translateX(16px); opacity: .7; } to { transform: translateX(0); opacity: 1; } }
  .mobile-link {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 46px;
    padding: 11px 12px;
    border-radius: 10px;
    font-size: 14px;
    text-decoration: none;
  }
  .mobile-link:hover { background: rgba(161,161,170,.13); }
  .mobile-link i { width: 20px; text-align: center; color: #10b981; }
  .dash-stat { min-width: 0; overflow-wrap: anywhere; }
  .mobile-scroll { max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .safe-bottom { padding-bottom: max(24px, env(safe-area-inset-bottom)); }

  @media (max-width: 640px) {
    html { scroll-padding-top: 72px; }
    .lift:hover { transform: none; }
    #root { width: 100%; min-width: 0; }
    main { min-width: 0; }
    .mobile-nav-panel { width: min(88vw, 360px); }
    #toast-container {
      left: 12px !important;
      right: 12px !important;
      bottom: max(12px, env(safe-area-inset-bottom)) !important;
      max-width: none !important;
    }
    #toast-container > div { overflow-wrap: anywhere; }
    .logs { height: 55vh !important; min-height: 260px; }
    input, select, textarea { max-width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body class="bg-white dark:bg-black text-zinc-900 dark:text-zinc-100 min-h-screen flex flex-col">
<div id="root" class="flex flex-col flex-1 min-h-screen"></div>
<div id="toast-container" class="fixed bottom-5 right-5 z-[60] flex flex-col gap-2 max-w-xs"></div>
<div id="modal"></div>
<script>
/* ===================== state & helpers ===================== */
// Same origin when served by the MtaaniHost server (recommended).
// Set window.MH_API only if the page is hosted elsewhere.
const API_BASE = typeof window.MH_API === 'string' ? window.MH_API : '';
let token = localStorage.getItem('mh_token'), atoken = sessionStorage.getItem('mh_admin');
let me = null, health = null, pollT = null, logCtl = null, humanTok = '', cfToken = '';
let cfg = { price: 70, trialDays: 14, storageGB: 10, human: 'math', github: false, baseDomain: null };
let pendingEmail = localStorage.getItem('mh_pending') || '';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));
const inp = 'w-full min-w-0 rounded-xl border border-zinc-300 dark:border-zinc-800 bg-white dark:bg-zinc-950 px-3 py-2.5 text-sm outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 placeholder:text-zinc-400';
const btn = 'inline-flex items-center justify-center gap-2 rounded-xl bg-zinc-900 dark:bg-white text-white dark:text-black px-4 py-2.5 text-sm font-semibold hover:opacity-85 disabled:opacity-50 whitespace-nowrap transition';
const btn2 = 'inline-flex items-center justify-center gap-2 rounded-xl border border-zinc-300 dark:border-zinc-800 px-3 py-2 text-sm hover:bg-zinc-100 dark:hover:bg-zinc-900 whitespace-nowrap transition';
const btnDanger = 'inline-flex items-center justify-center gap-2 rounded-xl border border-red-500/50 text-red-500 px-3 py-2 text-sm hover:bg-red-500/10 whitespace-nowrap';
const card = 'rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-950';
const lbl = 'block text-xs font-semibold text-zinc-500 mb-1.5';
const logo = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2 22 20H2L12 2Z" fill="currentColor"/></svg>`;
const domain = () => cfg.baseDomain || 'mtaanihost.ke';

function toast(msg, bad) {
  const box = $('#toast-container');
  if (!box) return;
  const d = document.createElement('div');
  d.className = `rounded-xl px-4 py-3 text-sm shadow-lg text-white fadein ${bad ? 'bg-red-600' : 'bg-emerald-600'}`;
  d.textContent = msg;
  box.appendChild(d);
  setTimeout(() => d.remove(), 4500);
}
async function api(p, o = {}, t = token) {
  const h = { 'Content-Type': 'application/json' };
  if (t) h.Authorization = 'Bearer ' + t;
  let r;
  try {
    r = await fetch(API_BASE + '/api' + p, {
      ...o,
      headers: { ...(o.headers || {}), ...h },
      body: o.body ? JSON.stringify(o.body) : undefined
    });
  } catch {
    throw new Error('Cannot reach the server. Check your internet, or wait a minute if the server is waking up.');
  }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const e = new Error(j.error || 'Something went wrong');
    e.status = r.status;
    e.data = j;
    throw e;
  }
  return j;
}
const setTheme = d => {
  document.documentElement.classList.toggle('dark', d);
  localStorage.setItem('mh_theme', d ? 'dark' : 'light');
};
const toggleTheme = () => setTheme(!document.documentElement.classList.contains('dark'));
function logout() {
  token = null;
  me = null;
  localStorage.removeItem('mh_token');
  closeMobileNav();
  location.hash = '#/';
}
async function loadCfg() {
  try { cfg = { ...cfg, ...(await api('/config', {}, null)) }; } catch {}
}
async function checkHealth() {
  try { health = await api('/health', {}, null); }
  catch { health = { ok: false }; }
  const el = $('#apiStatus');
  if (el) el.innerHTML = statusHtml();
}
const statusHtml = () => health === null
  ? 'Checking…'
  : health.ok
    ? '<span class="text-emerald-500">●</span> All systems normal'
    : '<span class="text-red-500">●</span> API unreachable';
async function loadMe() {
  if (!token) return null;
  try { me = await api('/me'); }
  catch (e) {
    if (e.status === 401) {
      token = null;
      localStorage.removeItem('mh_token');
    }
    me = null;
  }
  return me;
}
async function requireAuth() {
  if (await loadMe()) return true;
  if (token) {
    publicShell(`<div class="max-w-md mx-auto px-4 py-24 text-center"><div class="text-4xl mb-3">⏳</div><h1 class="text-xl font-semibold mb-2">The server is waking up</h1><p class="text-sm text-zinc-500 mb-6">Free servers sleep when idle and can take up to a minute to start.</p><button class="${btn}" onclick="route()">Try again</button></div>`);
    return false;
  }
  location.hash = '#/login';
  return false;
}
function goTo(id) {
  const s = () => document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
  if (location.hash && location.hash !== '#/') {
    location.hash = '#/';
    setTimeout(s, 150);
  } else s();
}
const fmtB = b => b >= 1073741824
  ? (b / 1073741824).toFixed(2) + ' GB'
  : b >= 1048576
    ? (b / 1048576).toFixed(1) + ' MB'
    : Math.max(0, Math.round((b || 0) / 1024)) + ' KB';
function ago(ts) {
  if (!ts) return 'never';
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}
function pill(status) {
  const m = {
    live: ['emerald', 'Ready'],
    building: ['amber', 'Building', 1],
    queued: ['amber', 'Queued', 1],
    failed: ['red', 'Failed'],
    crashed: ['red', 'Crashed'],
    stopped: ['zinc', 'Stopped'],
    suspended: ['red', 'Suspended']
  }[status] || ['zinc', status];
  return `<span class="inline-flex items-center gap-1.5 text-xs font-semibold text-${m[0]}-500 whitespace-nowrap"><span class="h-2 w-2 shrink-0 rounded-full bg-${m[0]}-500 ${m[2] ? 'pulse' : ''}"></span>${esc(m[1])}</span>`;
}
function parseHash() {
  const [path, qs] = (location.hash || '#/').split('?');
  return { path, parts: path.replace(/^#\//, '').split('/').filter(Boolean), q: new URLSearchParams(qs || '') };
}
function stopAll() {
  clearInterval(pollT);
  pollT = null;
  if (logCtl) {
    logCtl.abort();
    logCtl = null;
  }
}

/* ===================== layout ===================== */
function storageBar() {
  if (!me || !me.storage) return '';
  const u = me.storage.usedBytes || 0, q = me.storage.quotaBytes || 0;
  const pct = Math.min(100, q ? (u / q) * 100 : 100);
  return `<div class="text-xs text-zinc-500 w-full sm:min-w-[180px] sm:max-w-xs">
    <div class="flex justify-between gap-3 mb-1.5"><span>Storage used</span><span class="font-medium">${fmtB(u)} / ${fmtB(q)}</span></div>
    <div class="h-2 rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden"><div class="h-full rounded-full ${pct > 90 ? 'bg-red-500' : 'bg-emerald-500'}" style="width:${pct}%"></div></div>
  </div>`;
}
function mobileNavHtml(mode) {
  if (mode === 'app') {
    const nm = me?.displayName || me?.email || 'Account';
    return `<div id="mobileNav" class="mobile-nav" aria-hidden="true" onclick="if(event.target===this)closeMobileNav()">
      <nav class="mobile-nav-panel" aria-label="Main navigation">
        <div class="flex items-center justify-between gap-3 mb-5">
          <a href="#/dashboard" onclick="closeMobileNav()" class="flex items-center gap-2 font-bold">${logo}<span>MtaaniHost</span></a>
          <button class="${btn2}" onclick="closeMobileNav()" aria-label="Close menu"><i class="fas fa-xmark"></i></button>
        </div>
        <div class="flex items-center gap-3 p-3 rounded-xl bg-zinc-100 dark:bg-zinc-900 mb-4">
          <div class="h-11 w-11 rounded-full bg-gradient-to-br from-emerald-400 to-violet-500 text-white font-bold grid place-items-center shrink-0">${esc(nm[0].toUpperCase())}</div>
          <div class="min-w-0"><div class="font-semibold text-sm truncate">${esc(nm)}</div><div class="text-xs text-zinc-500 truncate">${esc(me?.email || '')}</div></div>
        </div>
        <div class="space-y-1">
          <a class="mobile-link" href="#/dashboard" onclick="closeMobileNav()"><i class="fas fa-gauge-high"></i> Dashboard</a>
          <a class="mobile-link" href="#/new" onclick="closeMobileNav()"><i class="fas fa-plus"></i> Create a project</a>
          <a class="mobile-link" href="#/dashboard" onclick="closeMobileNav()"><i class="fas fa-folder-open"></i> My projects</a>
          <a class="mobile-link" href="#/billing" onclick="closeMobileNav()"><i class="fas fa-credit-card"></i> Billing &amp; payments</a>
          <a class="mobile-link" href="#/settings" onclick="closeMobileNav()"><i class="fas fa-user-gear"></i> Profile &amp; settings</a>
          <div class="my-3 border-t border-zinc-200 dark:border-zinc-800"></div>
          <div class="px-3 pt-1 pb-2 text-[11px] uppercase tracking-widest text-zinc-500 font-bold">Appearance</div>
          <button class="mobile-link" onclick="toggleTheme();closeMobileNav()"><i class="fas fa-circle-half-stroke"></i> Switch light / dark mode</button>
          <button class="mobile-link text-red-500" onclick="logout()"><i class="fas fa-right-from-bracket !text-red-500"></i> Log out</button>
        </div>
        <div class="mt-6 p-3 rounded-xl border border-zinc-200 dark:border-zinc-800 text-xs text-zinc-500">
          <div class="font-semibold mb-1">MtaaniHost status</div><span id="mobileApiStatus">${statusHtml()}</span>
        </div>
      </nav>
    </div>`;
  }
  return '';
}
function headerHtml(mode) {
  const themeBtn = `<button onclick="toggleTheme()" title="Switch theme" aria-label="Switch theme" class="h-10 w-10 shrink-0 rounded-xl hover:bg-zinc-100 dark:hover:bg-zinc-900 grid place-items-center"><i class="fas fa-adjust"></i></button>`;
  const lk = 'hidden md:block px-2 text-sm text-zinc-500 hover:text-zinc-900 dark:hover:text-white cursor-pointer';
  let right = '', nav = '';
  if (mode === 'app') {
    nav = `<a class="${lk} !block" href="#/dashboard">Projects</a><a class="${lk} !block" href="#/billing">Billing</a>`;
    const nm = me?.displayName || me?.email || '?';
    right = `<a class="${btn} !px-3 !py-2" href="#/new"><i class="fas fa-plus"></i><span class="hidden sm:inline">New Project</span></a>
      <span class="hidden sm:inline">${themeBtn}</span>
      <div class="relative hidden sm:block"><button id="menuBtn" onclick="toggleMenu(event)" aria-label="Open account menu" class="h-10 w-10 rounded-full bg-gradient-to-br from-emerald-400 to-violet-500 text-white text-sm font-bold grid place-items-center">${esc(nm[0].toUpperCase())}</button>
      <div id="menu" class="hidden absolute right-0 top-full mt-2 w-60 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 shadow-xl p-1.5 z-50">
        <div class="px-3 py-2 border-b border-zinc-200 dark:border-zinc-800 mb-1"><div class="text-sm font-semibold truncate">${esc(nm)}</div><div class="text-xs text-zinc-500 truncate">${esc(me?.email || '')}</div></div>
        <a class="block px-3 py-2.5 text-sm rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-900" href="#/dashboard">My projects</a>
        <a class="block px-3 py-2.5 text-sm rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-900" href="#/billing">Billing &amp; payments</a>
        <a class="block px-3 py-2.5 text-sm rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-900" href="#/settings">Profile &amp; Settings</a>
        <button class="block w-full text-left px-3 py-2.5 text-sm rounded-lg text-red-500 hover:bg-red-500/10" onclick="logout()">Log out</button></div></div>
      <button class="md:hidden h-10 w-10 shrink-0 rounded-xl border border-zinc-200 dark:border-zinc-800 grid place-items-center" onclick="openMobileNav()" aria-label="Open navigation menu" aria-controls="mobileNav"><i class="fas fa-bars"></i></button>`;
  } else if (mode === 'admin') {
    right = `${themeBtn}${atoken ? `<button class="${btn2}" onclick="adminLogout()">Admin log out</button>` : ''}<a class="${btn2}" href="#/">Home</a>`;
  } else {
    nav = `<a class="${lk} !block" onclick="goTo('features')">Features</a><a class="${lk} !block" onclick="goTo('pricing')">Pricing</a><a class="${lk} !block" onclick="goTo('faq')">FAQ</a>`;
    right = `${themeBtn}${token ? `<a class="${btn}" href="#/dashboard">Dashboard</a>` : `<a class="${btn2}" href="#/login">Log in</a><a class="${btn}" href="#/signup">Sign up</a>`}`;
  }
  return `<header class="sticky top-0 z-40 backdrop-blur border-b border-zinc-200 dark:border-zinc-900 bg-white/90 dark:bg-black/85">
    <div class="max-w-6xl mx-auto px-3 sm:px-4 h-14 sm:h-16 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 sm:gap-4 min-w-0"><a href="#/" class="flex items-center gap-2 font-bold shrink-0">${logo}<span>MtaaniHost</span></a>${nav}</div>
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">${right}</div>
    </div>
  </header>${mobileNavHtml(mode)}`;
}
function footerHtml() {
  return `<footer class="border-t border-zinc-200 dark:border-zinc-900 mt-12 sm:mt-16">
    <div class="max-w-6xl mx-auto px-4 py-8 flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between text-xs text-zinc-500">
      <div>© ${new Date().getFullYear()} MtaaniHost · Nairobi, Kenya</div>
      <div><span id="apiStatus">${statusHtml()}</span></div>
      <div class="flex flex-wrap gap-x-4 gap-y-2"><a class="hover:text-emerald-500" href="#/billing">Billing</a><a class="hover:text-emerald-500 cursor-pointer" onclick="goTo('faq')">FAQ</a><a class="hover:text-emerald-500" href="#/admin">Admin</a></div>
    </div>
  </footer>`;
}
const publicShell = inner => {
  $('#root').innerHTML = `${headerHtml('public')}<main class="flex-1 fadein min-w-0">${inner}</main>${footerHtml()}`;
};
const appShell = inner => {
  $('#root').innerHTML = `${headerHtml('app')}<main class="flex-1 max-w-6xl w-full min-w-0 mx-auto px-3 sm:px-4 py-5 sm:py-8 fadein">${inner}</main>${footerHtml()}`;
};
const adminShell = inner => {
  $('#root').innerHTML = `${headerHtml('admin')}<main class="flex-1 max-w-6xl w-full min-w-0 mx-auto px-3 sm:px-4 py-5 sm:py-8 fadein">${inner}</main>${footerHtml()}`;
};
function openMobileNav() {
  const n = $('#mobileNav');
  if (!n) return;
  n.classList.add('open');
  n.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closeMobileNav() {
  const n = $('#mobileNav');
  if (!n) return;
  n.classList.remove('open');
  n.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}
function toggleMenu(e) {
  e?.stopPropagation();
  $('#menu')?.classList.toggle('hidden');
}
document.addEventListener('click', e => {
  const m = $('#menu');
  if (m && !e.target.closest('#menu') && !e.target.closest('#menuBtn')) m.classList.add('hidden');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeMobileNav();
});

/* ===================== landing page ===================== */
function landing() {
  const P = cfg.price, T = cfg.trialDays, S = cfg.storageGB;
  const feats = [
    ['fab fa-github', 'Import from GitHub', 'Connect GitHub once, pick a repository and deploy. Private repositories work too.'],
    ['fas fa-wand-magic-sparkles', 'Smart build settings', 'We read your package.json and suggest the install, build and start commands. Edit them any time.'],
    ['fas fa-terminal', 'Live build logs', 'Watch your build and your running app live, line by line, right in the browser.'],
    ['fas fa-key', 'Environment variables', 'Add your configuration keys. Saved values stay hidden in the editor.'],
    ['fas fa-link', 'Your own project link', `Your site can be available at yourname.${domain()} when configured on the server.`],
    ['fas fa-mobile-screen', 'Pay with M-Pesa', `KES ${P} a month through Paystack. Payment can reactivate your account automatically.`]
  ];
  const faqs = [
    ['What can I deploy?', 'Static websites (plain HTML, Vite, React, Vue, Astro and more), Node.js web apps (Express, Next.js) and Node.js bots (WhatsApp, Telegram, Discord) from a GitHub repository. Actual support depends on your server configuration.'],
    ['How does the free trial work?', `Every new account gets ${T} days free. You can deploy straight away and no card is needed.`],
    ['What happens when the trial ends?', `Your sites may go offline when the trial expires. The listed price is KES ${P} per month. Pay to reactivate your service; project data is handled by the platform's existing retention rules.`],
    ['How much storage do I get?', `${S} GB per account by default. The admin can adjust storage for an account.`],
    ['Do I need a GitHub account?', 'To import repositories directly, connect GitHub. You can also sign up with email and password and paste the URL of a public repository.'],
    ['Can I deploy a private repository?', 'Yes, if your GitHub connection has the required permissions for that repository.'],
    ['Can I add environment variables?', 'Yes. Open a project, choose Environment, add the required keys and save. Changes apply on the next deployment.'],
    ['Where can I see build errors?', 'Open your project and choose Logs to inspect available build and runtime output.'],
    ['Can I redeploy my project?', 'Yes. Open the project and use the Redeploy action.'],

/* ===================== human check + auth ===================== */
function loadTurnstile() {
  return new Promise((ok, no) => {
    const t0 = Date.now();
    if (!document.querySelector('script[data-turnstile]')) {
      const s = document.createElement('script');
      s.dataset.turnstile = '1';
      s.async = true;
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      s.onerror = () => no(new Error('Could not load the human check'));
      document.head.appendChild(s);
    }
    const iv = setInterval(() => {
      if (window.turnstile) {
        clearInterval(iv);
        ok();
      } else if (Date.now() - t0 > 8000) {
        clearInterval(iv);
        no(new Error('Could not load the human check'));
      }
    }, 60);
  });
}
async function setupHuman() {
  const box = $('#human');
  if (!box) return;
  humanTok = '';
  cfToken = '';
  if (cfg.human === 'turnstile' && cfg.turnstileSiteKey) {
    box.innerHTML = '<div id="cft"></div>';
    try {
      await loadTurnstile();
      window.turnstile.render('#cft', {
        sitekey: cfg.turnstileSiteKey,
        theme: document.documentElement.classList.contains('dark') ? 'dark' : 'light',
        callback: t => { cfToken = t; },
        'expired-callback': () => { cfToken = ''; }
      });
    } catch (e) {
      box.innerHTML = `<p class="text-xs text-red-500">${esc(e.message)}. Refresh the page.</p>`;
    }
    return;
  }
  try {
    const h = await api('/human', {}, null);
    humanTok = h.token;
    box.innerHTML = `<label class="${lbl}">Verify you're human: what is <b>${esc(h.question)}</b>?</label><div class="flex gap-2"><input class="${inp}" id="ha" inputmode="numeric" autocomplete="off" placeholder="Your answer" required><button type="button" class="${btn2}" id="hr" title="New question">↻</button></div>`;
    $('#hr').onclick = setupHuman;
  } catch (e) {
    box.innerHTML = `<p class="text-xs text-red-500">${esc(e.message)}</p>`;
  }
}

    <div id="human"><p class="text-xs text-zinc-500">Loading human check…</p></div><button class="${btn} w-full !py-3" id="sb">${su ? 'Create account' : 'Log in'}</button></form>

  if (q.get('error')) toast(q.get('error'), true);
  setupHuman();
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const email = $('#em').value.trim(), password = $('#pw').value;

    const b = $('#sb');

    try {
      const r = await api(su ? '/auth/signup' : '/auth/login', {
        method: 'POST',
        body: { email, password, humanToken: humanTok, humanAnswer: $('#ha') ? $('#ha').value : '', cfToken }
      }, null);
      if (su && !r.token) {
        pendingEmail = email;
        localStorage.setItem('mh_pending', email);
        location.hash = '#/verify';
        return;
      }
      token = r.token;
      localStorage.setItem('mh_token', token);
      me = r.user;
      location.hash = '#/dashboard';
    } catch (err) {
      if (err.data && err.data.needVerify) {
        pendingEmail = email;
        localStorage.setItem('mh_pending', email);
        location.hash = '#/verify';
        return;
      }
      toast(err.message, true);
      b.disabled = false;
      setupHuman();
    }
  };
}

    };

      catch (e) { toast(e.message, true); }

      catch (err) { toast(err.message, true); }
    };

/* ===================== environment variable editor ===================== */
function envRow(key = '', saved = false, value = '') {
  return `<div class="env-row grid grid-cols-1 sm:grid-cols-[1fr_1fr_auto] gap-2 min-w-0" data-saved="${saved ? 1 : 0}">
    <input class="${inp} font-mono env-k" placeholder="KEY" value="${esc(key)}" ${saved ? 'readonly' : ''} aria-label="Environment variable key">
    <input class="${inp} font-mono env-v" type="${saved ? 'password' : 'text'}" placeholder="${saved ? '•••••••• saved (empty = keep)' : 'value'}" value="${esc(value)}" autocomplete="off" aria-label="Environment variable value">
    <button type="button" class="${btn2}" onclick="this.closest('.env-row').remove()" title="Remove variable" aria-label="Remove variable">✕ Remove</button>
  </div>`;
}
const envEditor = vars => `<div id="envrows" class="space-y-2">${vars.map(v => envRow(v.key, true)).join('')}</div>
  <div class="flex flex-wrap gap-2 mt-3"><button type="button" class="${btn2}" onclick="addEnvRow()">+ Add variable</button><button type="button" class="${btn2}" onclick="toggleBulk()">Paste .env</button></div>
  <div id="bulk" class="hidden mt-3"><textarea id="bulkta" rows="5" class="${inp} font-mono" placeholder="KEY=value&#10;ANOTHER_KEY=value"></textarea><button type="button" class="${btn2} mt-2" onclick="applyBulk()">Add these variables</button></div>`;
function addEnvRow(k = '', v = '') {
  const rows = $('#envrows');
  if (rows) rows.insertAdjacentHTML('beforeend', envRow(k, false, v));
}
function toggleBulk() { $('#bulk')?.classList.toggle('hidden'); }
function applyBulk() {
  const area = $('#bulkta');
  if (!area) return;
  for (const l of area.value.split(/\r?\n/)) {
    const m = l.match(/^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)\s*$/);
    if (m) addEnvRow(m[1], m[2].replace(/^["']|["']$/g, ''));
  }
  area.value = '';
  $('#bulk')?.classList.add('hidden');
}
const readEnv = () => [...document.querySelectorAll('.env-row')].map(r => {
  const key = r.querySelector('.env-k').value.trim(), v = r.querySelector('.env-v').value;
  return { key, value: r.dataset.saved === '1' && v === '' ? null : v };
}).filter(x => x.key);

}
const typeSelect = type => `<select class="${inp}" id="c_type"><option value="static" ${type === 'static' ? 'selected' : ''}>Static website (HTML, React, Vue…)</option><option value="web" ${type === 'web' ? 'selected' : ''}>Web service (Node.js, Express, Next.js)</option><option value="worker" ${type === 'worker' ? 'selected' : ''}>Background worker / bot (no website)</option></select>`;

function readCmds() {

    buildCmd: $('#c_build').value.trim(),
    startCmd: t === 'static' ? '' : $('#c_start').value.trim(),

  async function deployView(mode){if(!(await requireAuth()))return;const gh=mode==='github',kind=gh?ghKind:mode;const title=gh?'Import from GitHub':kind==='bot'?'Deploy a bot':'Deploy a website';appShell(gh?'github':`deploy/${kind}`,gh?`<div class="max-w-4xl mx-auto"><h1 class="text-3xl font-extrabold">Import from GitHub</h1><p class="muted mt-2 mb-6">Connect GitHub, then import the repository you want to deploy.</p><div class="flex gap-3 mb-5"><button class="btn2 ${ghKind==='website'?'border-blue-400':''}" onclick="ghKind='website';deployView('github')">🌐 Website</button><button class="btn2 ${ghKind==='bot'?'border-blue-400':''}" onclick="ghKind='bot';deployView('github')">🤖 Bot</button></div><div class="panel p-6"><div class="flex flex-wrap justify-between items-center gap-3"><div><h2 class="font-bold text-lg">Your repositories</h2><p class="muted text-sm mt-1">GitHub OAuth must be configured on your server.</p></div><button class="btn" id="ghConnect"><i class="fa-brands fa-github"></i> Connect / refresh</button></div><input class="field mt-5" id="ghSearch" placeholder="Filter repositories"><div id="ghList" class="space-y-3 mt-4"><p class="muted text-sm">Connect GitHub to load repositories.</p></div></div></div>`:`<div class="max-w-2xl mx-auto"><div class="mb-7"><p class="text-sm muted">PROJECT DEPLOYMENT</p><h1 class="text-3xl font-extrabold mt-2">${title}</h1><p class="muted mt-2">Provide your project files or a supported public repository.</p></div><form id="deployForm" class="panel p-6 sm:p-7 space-y-5"><div><label class="text-sm muted">Project name</label><input class="field mt-2" id="projectName" maxlength="40" required placeholder="my-awesome-project"></div>${kind==='bot'?`<div><label class="text-sm muted">Bot platform</label><select class="field mt-2" id="botType"><option value="baileys">WhatsApp (Baileys)</option><option value="telegram">Telegram</option><option value="discord">Discord</option></select></div>`:''}<div><label class="text-sm muted">GitHub URL (optional)</label><input class="field mt-2" id="githubUrl" type="url" placeholder="https://github.com/username/repository"></div><div class="text-center muted text-xs">— OR —</div><div><label class="text-sm muted">Upload ZIP ${kind==='bot'?'(must include package.json)':'(must include index.html)'}</label><input class="field mt-2" type="file" id="zipFile" accept=".zip,application/zip"></div>${kind==='bot'?`<div><label class="text-sm muted">Environment variables (one KEY=value per line)</label><textarea class="field mt-2 font-mono" rows="4" id="deployEnv" placeholder="BOT_TOKEN=...\nNODE_ENV=production"></textarea></div>`:''}<div class="rounded-xl bg-blue-500/10 border border-blue-400/20 p-4 text-sm muted"><i class="fa-solid fa-circle-info text-blue-300 mr-2"></i>Deployment requires the matching backend route and runtime to be configured.</div><button class="btn w-full py-3" id="deploySubmit"><i class="fa-solid fa-rocket"></i> Deploy project</button><p id="deployError" class="text-sm text-red-300"></p></form></div>`);if(gh){$('#ghConnect').onclick=()=>{location.href=API_BASE+'/api/github/login?token='+encodeURIComponent(token)};$('#ghSearch').oninput=e=>filterRepos(e.target.value);const q=new URLSearchParams(location.search);if(q.has('github_connected'))history.replaceState({},'',location.pathname+'#/github');checkGitHubRepos(false);return}$('#deployForm').onsubmit=async e=>{e.preventDefault();const githubUrl=$('#githubUrl').value.trim(),file=$('#zipFile').files[0];if(!githubUrl&&!file){toast('Upload a ZIP or enter a GitHub URL',true);return}const fd=new FormData();fd.append('name',$('#projectName').value.trim());fd.append('githubUrl',githubUrl);if(file)fd.append('file',file);if(kind==='bot'){fd.append('botType',$('#botType').value);fd.append('envVars',$('#deployEnv').value)}const b=$('#deploySubmit');b.disabled=true;b.textContent='Deploying…';$('#deployError').textContent='';try{const p=await api(kind==='bot'?'/projects/bot':'/projects/website',{method:'POST',body:fd});$('#deployForm').innerHTML=`<div class="text-center py-8"><div class="text-5xl text-emerald-300">✓</div><h2 class="text-2xl font-bold mt-4">Deployment request accepted</h2><p class="muted mt-2">${p.url?'Your website URL: '+esc(p.url):'Your project was submitted. Check the dashboard and logs for status.'}</p>${p.url?`<a class="btn mt-5" target="_blank" rel="noopener" href="${esc(p.url)}">Open website</a>`:''}<a class="btn2 mt-5 ml-2" href="#/dashboard">Go to dashboard</a></div>`}catch(err){toast(err.message,true);$('#deployError').textContent=err.message;if(err.status===402)location.hash='#/billing';b.disabled=false;b.innerHTML='<i class="fa-solid fa-rocket"></i> Deploy project'}}}
async function checkGitHubRepos(force){try{const repos=await api('/github/repos');ghRepos=repos;renderRepoList(repos)}catch(e){const list=$('#ghList');if(list)list.innerHTML=`<div class="rounded-xl bg-amber-500/10 border border-amber-400/20 p-4 text-sm muted">${esc(e.message)}<p class="mt-2">Use Connect / refresh to authorize GitHub, or confirm GitHub OAuth is configured on the server.</p></div>`;if(force)toast(e.message,true)}}

function filterRepos(q){document.querySelectorAll('.repo-item').forEach(el=>el.style.display=el.dataset.name.includes(q.toLowerCase())?'':'none')}
async function importGhRepo(url,name){const finalName=prompt('Project name:',name)||name;if(!finalName)return;let envVars='';if(ghKind==='bot')envVars=prompt('Environment variables (KEY=value, one per line):','')||'';const fd=new FormData();fd.append('name',finalName);fd.append('githubUrl',url);if(ghKind==='bot'){fd.append('botType','baileys');fd.append('envVars',envVars)}try{toast('Importing repository…');const p=await api(ghKind==='bot'?'/projects/bot':'/projects/website',{method:'POST',body:fd});toast('Repository import submitted');if(p.url)window.open(p.url,'_blank','noopener');location.hash='#/dashboard'}catch(e){toast(e.message,true);if(e.status===402)location.hash='#/billing'}}
async function billingView(){if(!(await requireAuth()))return;const exp=me.paidUntil||me.trialEndsAt;appShell('billing',`<div class="max-w-3xl mx-auto"><p class="text-sm muted">ACCOUNT</p><h1 class="text-3xl font-extrabold mt-2 mb-7">Billing & payments</h1><div class="grid md:grid-cols-2 gap-4"><div class="panel p-6"><p class="muted text-sm">Current status</p><div class="mt-3">${statusBadge(me.status)}</div><p class="muted text-sm mt-5">Days remaining</p><p class="text-3xl font-extrabold mt-1">${esc(me.daysLeft??'—')}</p><p class="muted text-sm mt-4">Expiry date: ${exp?esc(new Date(exp).toLocaleDateString()):'—'}</p></div><div class="panel p-6"><p class="muted text-sm">Monthly plan</p><p class="text-4xl font-extrabold grad-text mt-3">KES ${esc(me.price??cfg.price)}</p><p class="muted text-sm mt-1">per month</p><button class="btn w-full mt-6 py-3" id="payBtn"><i class="fa-solid fa-lock"></i> Continue to secure payment</button><p class="muted text-xs mt-3">Checkout is provided by your configured Paystack integration.</p></div></div><div class="panel p-6 mt-5"><h2 class="font-bold">Payment help</h2><p class="muted text-sm mt-2">If you have completed payment but your account has not updated, wait briefly and refresh this page. Avoid making a second payment until the first transaction status is clear.</p></div></div>`);$('#payBtn').onclick=async e=>{const b=e.currentTarget;b.disabled=true;try{const r=await api('/billing/pay',{method:'POST'});if(!r.url)throw Error('Payment URL was not returned by the server');location.href=r.url}catch(err){toast(err.message,true);b.disabled=false}}}
async function profileView(){if(!(await requireAuth()))return;let p;try{p=await api('/profile')}catch(e){toast(e.message,true);return}appShell('profile',`<div class="max-w-3xl mx-auto"><h1 class="text-3xl font-extrabold mb-7">Your profile</h1><div class="panel p-6 flex items-center gap-4 mb-5"><div class="w-16 h-16 rounded-2xl grad-bg grid place-items-center text-2xl font-bold">${esc((p.displayName||p.email||'U')[0].toUpperCase())}</div><div><h2 class="font-bold text-xl">${esc(p.displayName||'MtaaniHost user')}</h2><p class="muted text-sm">${esc(p.email)}</p><div class="mt-2">${statusBadge(p.status)}</div></div></div><div class="panel p-6 space-y-4"><div class="flex justify-between gap-4"><span class="muted">Member since</span><span>${p.memberSince?esc(new Date(p.memberSince).toLocaleDateString()):'—'}</span></div><div class="flex justify-between gap-4"><span class="muted">Projects</span><span>${esc(p.projects??'—')} (${esc(p.websites??0)} websites, ${esc(p.bots??0)} bots)</span></div><div class="flex justify-between gap-4"><span class="muted">Plan days left</span><span>${esc(p.daysLeft??'—')}</span></div></div><a class="btn mt-5" href="#/settings">Edit profile settings</a></div>`)}
async function settingsView(){if(!(await requireAuth()))return;let p;try{p=await api('/profile')}catch(e){toast(e.message,true);return}const light=localStorage.getItem('mh_theme')==='light';appShell('settings',`<div class="max-w-3xl mx-auto"><h1 class="text-3xl font-extrabold mb-2">Settings</h1><p class="muted mb-7">Manage your profile, password and appearance.</p><form id="profileForm" class="panel p-6 space-y-4 mb-5"><h2 class="font-bold text-lg">Profile information</h2><div><label class="text-sm muted">Display name</label><input class="field mt-1" id="displayName" maxlength="40" required value="${esc(p.displayName||'')}"></div><div><label class="text-sm muted">Email address</label><input class="field mt-1 opacity-60" disabled value="${esc(p.email)}"></div><button class="btn">Save profile</button></form><form id="passwordForm" class="panel p-6 space-y-4 mb-5"><h2 class="font-bold text-lg">Change password</h2><input class="field" id="currentPassword" type="password" autocomplete="current-password" required placeholder="Current password"><input class="field" id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="New password (at least 8 characters)"><input class="field" id="confirmPassword" type="password" required placeholder="Confirm new password"><button class="btn">Update password</button></form><div class="panel p-6 mb-5"><h2 class="font-bold text-lg">Appearance</h2><p class="muted text-sm mt-1 mb-4">Choose the theme that feels right for you.</p><div class="flex gap-3"><button class="btn2" onclick="setTheme(true);settingsView()">☀️ Light</button><button class="btn2" onclick="setTheme(false);settingsView()">🌙 Dark</button></div></div><div class="panel p-6 border-red-500/30"><h2 class="font-bold text-lg text-red-300">Delete account</h2><p class="muted text-sm mt-2">This is permanent and may remove your projects. Continue only if you are certain.</p><form id="deleteAccountForm" class="mt-4 space-y-3"><input class="field" id="deletePassword" type="password" required placeholder="Confirm your password"><button class="btn2 text-red-300 border-red-500/40">Delete my account</button></form></div></div>`);$('#profileForm').onsubmit=async e=>{e.preventDefault();try{await api('/profile',{method:'PUT',body:{displayName:$('#displayName').value.trim()}});toast('Profile saved');await loadMe()}catch(err){toast(err.message,true)}};$('#passwordForm').onsubmit=async e=>{e.preventDefault();if($('#newPassword').value!==$('#confirmPassword').value)return toast('Passwords do not match',true);try{await api('/settings/password',{method:'POST',body:{currentPassword:$('#currentPassword').value,newPassword:$('#newPassword').value}});toast('Password updated');e.target.reset()}catch(err){toast(err.message,true)}};$('#deleteAccountForm').onsubmit=async e=>{e.preventDefault();if(!confirm('Permanently delete your account and projects?'))return;try{await api('/account',{method:'DELETE',body:{password:$('#deletePassword').value}});toast('Account deleted');logout()}catch(err){toast(err.message,true)}}}

async function adminView(){if(!atoken){adminShell(`<div class="max-w-md mx-auto py-12"><div class="panel p-8"><div class="text-center mb-6"><div class="w-14 h-14 rounded-2xl grad-bg grid place-items-center text-2xl mx-auto"><i class="fa-solid fa-shield-halved"></i></div><h1 class="text-2xl font-extrabold mt-4">Admin sign in</h1><p class="muted text-sm mt-2">Use the administrator password configured on the server.</p></div><form id="adminLogin" class="space-y-4"><input class="field" type="password" id="adminPassword" required autocomplete="current-password" placeholder="Admin password"><button class="btn w-full">Sign in securely</button></form></div></div>`);$('#adminLogin').onsubmit=async e=>{e.preventDefault();try{const r=await api('/admin/login',{method:'POST',body:{password:$('#adminPassword').value}},null);atoken=r.token;sessionStorage.setItem('mh_admin',atoken);adminView()}catch(err){toast(err.message,true)}};return}let d;try{d=await api('/admin/overview',{},atoken)}catch(e){if(e.status===401){atoken='';sessionStorage.removeItem('mh_admin');toast('Admin session expired. Please sign in again.',true);return adminView()}adminShell(`<div class="panel p-8 max-w-xl mx-auto text-center"><h1 class="text-2xl font-bold">Admin overview unavailable</h1><p class="text-red-300 mt-3">${esc(e.message)}</p><button class="btn mt-5" onclick="adminView()">Retry</button></div>`);return}let st={price:cfg.price,trialDays:cfg.trialDays};try{st={...st,...await api('/admin/settings',{},atoken)}}catch{}await checkHealth();const s=d.stats||{};const stat=(a,b)=>`<div class="panel p-4"><p class="muted text-xs">${a}</p><p class="text-2xl font-extrabold mt-2">${esc(b??0)}</p></div>`;const th='text-left text-xs muted py-3 px-3';const td='text-sm py-3 px-3 border-t border-[#1e3858]';adminShell(`<div class="space-y-7"><div class="flex flex-wrap items-center justify-between gap-4"><div><p class="text-sm muted">CONTROL CENTER</p><h1 class="text-3xl font-extrabold mt-2">Admin dashboard</h1></div><button class="btn2" onclick="adminView()"><i class="fa-solid fa-rotate"></i> Refresh data</button></div>${health?.onRender&&!health?.persistent?'<div class="panel p-4 text-amber-200 border-amber-500/40">Warning: configure persistent storage on your hosting platform if your backend requires it to retain accounts and projects after restarts.</div>':''}${health?.requireVerify&&health?.mail==='none'?'<div class="panel p-4 text-amber-200 border-amber-500/40">Email verification is enabled but email delivery is not configured. Configure the mail settings in the server environment.</div>':''}<div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-5 gap-3">${stat('Users',s.users)}${stat('Trial',s.trial)}${stat('Paid',s.paid)}${stat('Expired',s.expired)}${stat('Blocked',s.blocked)}${stat('Projects',s.projects)}${stat('Live sites',s.liveSites)}${stat('Running bots',s.runningBots)}${stat('Revenue (KES)',s.revenue)}${stat('Email service',health?.mail||'unknown')}</div><section class="panel p-6"><h2 class="font-bold text-lg">Pricing and trial settings</h2><p class="muted text-sm mt-1 mb-5">Updates the values supported by your backend.</p><form id="adminSettings" class="grid sm:grid-cols-3 gap-4 items-end"><div><label class="muted text-sm">Monthly price (KES)</label><input class="field mt-2" type="number" min="10" max="100000" id="price" required value="${esc(st.price)}"></div><div><label class="muted text-sm">Trial days</label><input class="field mt-2" type="number" min="0" max="60" id="trialDays" required value="${esc(st.trialDays)}"></div><button class="btn">Save settings</button></form></section><section><h2 class="font-bold text-lg mb-3">Users</h2><div class="panel scroll-table p-3"><table class="w-full min-w-[700px]"><thead><tr>${['Email','Status','Days left','Projects','Actions'].map(x=>`<th class="${th}">${x}</th>`).join('')}</tr></thead><tbody>${(d.users||[]).map(u=>`<tr><td class="${td}">${esc(u.email)}</td><td class="${td}">${statusBadge(u.status)}</td><td class="${td}">${esc(u.daysLeft)}</td><td class="${td}">${esc(u.projects)}</td><td class="${td}"><div class="flex gap-2">${u.status==='unverified'?`<button class="btn2" onclick="adm('/users/${encodeURIComponent(u.id)}/verify',{})">Verify</button>`:''}<button class="btn2" onclick="adm('/users/${encodeURIComponent(u.id)}/block',{blocked:${!u.blocked}})">${u.blocked?'Unblock':'Block'}</button><button class="btn2" onclick="adm('/users/${encodeURIComponent(u.id)}/extend',{days:30})">+30 days</button></div></td></tr>`).join('')}</tbody></table></div></section><section><h2 class="font-bold text-lg mb-3">Projects</h2><div class="panel scroll-table p-3"><table class="w-full min-w-[700px]"><thead><tr>${['Name','Owner','Type','Status','Actions'].map(x=>`<th class="${th}">${x}</th>`).join('')}</tr></thead><tbody>${(d.projects||[]).map(p=>`<tr><td class="${td}">${esc(p.name)}</td><td class="${td}">${esc(p.owner)}</td><td class="${td}">${esc(p.type)}</td><td class="${td}">${statusBadge(p.status)}</td><td class="${td}"><div class="flex gap-2"><button class="btn2" onclick="adm('/projects/${encodeURIComponent(p.id)}/suspend',{suspended:${p.suspendedBy!=='admin'}})">${p.suspendedBy==='admin'?'Resume':'Suspend'}</button><button class="btn2 text-red-300" onclick="if(confirm('Delete this project?'))adm('/projects/${encodeURIComponent(p.id)}',null,'DELETE')">Delete</button></div></td></tr>`).join('')}</tbody></table></div></section><section><h2 class="font-bold text-lg mb-3">Payments</h2><div class="panel scroll-table p-3"><table class="w-full min-w-[600px]"><thead><tr>${['Date','Email','Amount','Channel'].map(x=>`<th class="${th}">${x}</th>`).join('')}</tr></thead><tbody>${(d.payments||[]).map(p=>`<tr><td class="${td}">${p.at?esc(new Date(p.at).toLocaleString()):'—'}</td><td class="${td}">${esc(p.email)}</td><td class="${td}">KES ${esc(p.amount)}</td><td class="${td}">${esc(p.channel)}</td></tr>`).join('')||`<tr><td class="${td} muted" colspan="4">No payments yet</td></tr>`}</tbody></table></div></section></div>`);$('#adminSettings').onsubmit=async e=>{e.preventDefault();try{const r=await api('/admin/settings',{method:'PUT',body:{price:$('#price').value,trialDays:$('#trialDays').value}},atoken);cfg={...cfg,...r};toast('Settings saved');adminView()}catch(err){toast(err.message,true)}}}
