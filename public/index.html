<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MtaaniHost limited — Deploy websites and bots in Kenya</title>
<script>
  if (localStorage.getItem('mh_theme') === 'light') document.documentElement.classList.remove('dark'); else document.documentElement.classList.add('dark');
  tailwind = { config: { darkMode: 'class' } };
</script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
.grid-bg{background-image:radial-gradient(circle at 1px 1px,rgba(128,128,128,.18) 1px,transparent 0);background-size:24px 24px}
.hero-glow{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(16,185,129,.15) 0%,transparent 70%);filter:blur(40px);pointer-events:none}
</style>
</head>
<body class="bg-zinc-50 dark:bg-black text-zinc-900 dark:text-zinc-100 min-h-screen flex flex-col">
<div id="nav"></div>
<main id="app" class="flex-1 relative"></main>
<div id="toast" class="fixed bottom-5 right-5 z-50"></div>
<div id="modal"></div>
<script>
const API_BASE = 'https://mtaani-hosting.onrender.com';
const esc = s => String(s?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = localStorage.getItem('mh_token'), atoken = sessionStorage.getItem('mh_admin'), me = null;
const inp = 'w-full rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition';
const btn = 'inline-flex items-center justify-center gap-2 rounded-xl bg-zinc-900 dark:bg-white text-white dark:text-black px-4 py-2.5 text-sm font-medium hover:opacity-85 disabled:opacity-50 shadow-sm';
const btn2 = 'inline-flex items-center justify-center gap-2 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-3 py-1.5 text-sm hover:bg-zinc-100 dark:hover:bg-zinc-800 transition';
const card = 'rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 shadow-sm';
const logo = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2 22 20H2L12 2Z" fill="currentColor"/><path d="M12 9l4.5 8h-9L12 9Z" fill="#10b981"/></svg>`;

function toast(msg, bad) {
  const d = document.createElement('div');
  d.className = `mb-2 rounded-xl px-4 py-2.5 text-sm shadow-lg text-white ${bad? 'bg-red-600' : 'bg-emerald-600'}`;
  d.textContent = msg; document.getElementById('toast').appendChild(d); setTimeout(() => d.remove(), 4000);
}
function $(s) { return document.querySelector(s); }
async function api(p, o = {}, t = token) {
  const fd = o.body instanceof FormData;
  const h = fd? {} : { 'Content-Type': 'application/json' };
  if (t) h.Authorization = 'Bearer ' + t;
  const r = await fetch(API_BASE + '/api' + p, {...o, headers: h, body: o.body &&!fd? JSON.stringify(o.body) : o.body });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'Something went wrong'); e.status = r.status; e.data = j; throw e; }
  return j;
}
function logout() { token = null; me = null; localStorage.removeItem('mh_token'); location.hash = '#/'; }
function toggleTheme() { const d = document.documentElement.classList.toggle('dark'); localStorage.setItem('mh_theme', d? 'dark' : 'light'); }
function setTheme(d) { document.documentElement.classList.toggle('dark', d); localStorage.setItem('mh_theme', d? 'dark' : 'light'); }
async function loadMe() { if (!token) return null; try { me = await api('/me'); } catch { token = null; localStorage.removeItem('mh_token'); me = null; } return me; }

function nav() {
  const admin = location.hash.startsWith('#/admin');
  $('#nav').innerHTML = `<header class="sticky top-0 z-40 backdrop-blur-xl border-b border-zinc-200/70 dark:border-zinc-900 bg-white/80 dark:bg-black/80">
  <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
    <a href="#/" class="flex items-center gap-2 font-semibold">${logo}<span>MtaaniHost</span></a>
    <nav class="flex items-center gap-2 text-sm">
      ${!token &&!admin? `<a class="hidden sm:block px-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white" href="#/" onclick="setTimeout(()=>document.getElementById('features')?.scrollIntoView(),50)">Features</a><a class="hidden sm:block px-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white" href="#/" onclick="setTimeout(()=>document.getElementById('pricing')?.scrollIntoView(),50)">Pricing</a>` : ''}
      <button class="${btn2}" onclick="toggleTheme()" title="Dark / Light">◐</button>
      ${token? `<a class="${btn2}" href="#/dashboard">Dashboard</a><a class="${btn2}" href="#/profile">Profile</a><a class="${btn2}" href="#/billing">Billing</a><button class="${btn2}" onclick="logout()">Logout</button>`
        : `<a class="${btn2}" href="#/login">Login</a><a class="${btn}" href="#/signup">Sign Up</a>`}
    </nav></div></header>`;
}

function landing() {
  const feats = [
    ['🌐', 'Static Hosting', 'Upload a ZIP of HTML/CSS/JS or paste a GitHub URL — your site is live in seconds.'],
    ['🤖', 'Bots 24/7', 'WhatsApp (Baileys), Telegram and Discord bots that keep running without stopping.'],
    ['⚡', 'Fast & Simple', 'No verification stress. Register and deploy immediately.'],
    ['💳', 'Paystack Billing', 'Pay with M-Pesa or card. Once you pay, your projects come back online automatically.']
  ];
  $('#app').innerHTML = `
  <section class="grid-bg relative overflow-hidden"><div class="hero-glow"></div>
  <div class="max-w-4xl mx-auto px-4 py-24 text-center relative">
    <span class="inline-flex items-center gap-2 rounded-full border border-emerald-200 dark:border-emerald-900 bg-emerald-50 dark:bg-emerald-950/50 px-3 py-1 text-xs text-emerald-700 dark:text-emerald-300 mb-6">🇰🇪 Hosting made in Kenya • 7 days free</span>
    <h1 class="text-4xl sm:text-6xl font-bold tracking-tight">Deploy your website or bot <span class="text-emerald-500">in minutes</span></h1>
    <p class="mt-6 text-lg text-zinc-500 max-w-2xl mx-auto">Like Vercel and Render, but built for Kenya. Pay with M-Pesa and start without the stress.</p>
    <div class="mt-10 flex flex-wrap gap-3 justify-center"><a href="#/signup" class="${btn} px-6 py-3 text-base">Deploy website or bot</a><a href="#/login" class="${btn2} px-6 py-3 text-base">Login</a></div>
  </div></section>
  <section id="features" class="max-w-6xl mx-auto px-4 py-20">
    <h2 class="text-3xl font-bold text-center mb-12">Everything you need</h2>
    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${feats.map(f => `<div class="${card} p-6 hover:shadow-md transition"><div class="text-3xl mb-4">${f[0]}</div><h3 class="font-semibold mb-2">${f[1]}</h3><p class="text-sm text-zinc-500">${f[2]}</p></div>`).join('')}</div>
  </section>
  <section id="pricing" class="max-w-6xl mx-auto px-4 py-20">
    <h2 class="text-3xl font-bold text-center mb-12">Simple pricing</h2>
    <div class="grid sm:grid-cols-2 gap-4 max-w-3xl mx-auto">
      <div class="${card} p-8"><h3 class="font-semibold">Free Trial</h3><p class="text-4xl font-bold mt-3">KES 0</p><p class="text-zinc-500 text-sm mt-1">7 days</p><ul class="mt-6 text-sm space-y-2 text-zinc-500"><li>✓ Deploy anything</li><li>✓ No card required</li></ul><a href="#/signup" class="${btn2} w-full mt-8">Start free</a></div>
      <div class="${card} p-8 border-emerald-500 shadow-emerald-100 dark:shadow-none shadow-lg"><h3 class="font-semibold">Pro</h3><p class="text-4xl font-bold mt-3">KES 200</p><p class="text-zinc-500 text-sm mt-1">per month</p><ul class="mt-6 text-sm space-y-2 text-zinc-500"><li>✓ Static sites and bots</li><li>✓ M-Pesa and card</li><li>✓ Online 24/7</li></ul><a href="#/signup" class="${btn} w-full mt-8">Get started</a></div>
    </div>
  </section>
  <footer class="border-t border-zinc-200 dark:border-zinc-900 py-8 text-center text-sm text-zinc-500">© ${new Date().getFullYear()} MtaaniHost — Made in Kenya 🇰🇪 · <a class="underline" href="#/admin">Admin</a></footer>`;
}

// ===== FIXED AUTH - NO VERIFICATION, PASSWORD MBILI =====
function authView(mode) {
  const su = mode === 'signup';
  const q = new URLSearchParams(location.hash.split('?')[1] || '');
  $('#app').innerHTML = `<div class="max-w-sm mx-auto px-4 py-20"><div class="${card} p-8 shadow-lg">
    <div class="flex justify-center mb-4">${logo}</div><h1 class="text-xl font-semibold text-center mb-1">${su? 'Create your account' : 'Welcome back'}</h1>
    <p class="text-center text-sm text-zinc-500 mb-6">${su? 'Password mbili lazima zifanane' : 'Login kuingia dashboard'}</p>
    ${q.get('verified')? '<p class="mb-4 text-sm text-emerald-500 text-center">Account created! Login now.</p>' : ''}
    <form id="f" class="space-y-3">
      <input class="${inp}" type="email" id="em" placeholder="Email" required>
      <input class="${inp}" type="password" id="pw" placeholder="Password ${su? '(min 6 chars)' : ''}" required>
      ${su? `<input class="${inp}" type="password" id="pw2" placeholder="Confirm password - weka ile ile tena" required>` : ''}
      <button class="${btn} w-full" id="sb">${su? 'Sign Up' : 'Login'}</button>
    </form>
    <p class="text-center text-sm text-zinc-500 mt-4">${su? 'Already have an account? <a class="underline" href="#/login">Login</a>' : "Don't have an account? <a class=\"underline\" href=\"#/signup\">Sign Up</a>"}</p></div></div>`;

  $('#f').onsubmit = async e => {
    e.preventDefault();
    const b = $('#sb');
    const email = $('#em').value.trim();
    const password = $('#pw').value;

    if(su){
      const pw2 = $('#pw2').value;
      if(password!== pw2){ toast('Password mbili hazifanani! Weka ile ile', true); return; }
      if(password.length < 6){ toast('Password angalau 6 characters', true); return; }
    }

    b.disabled = true; b.textContent = 'Please wait...';
    try {
      if (su) {
        const r = await api('/auth/signup', { method: 'POST', body: { email, password } });
        token = r.token; localStorage.setItem('mh_token', token); me = r.user;
        toast('Account created! Karibu MtaaniHost'); location.hash = '#/dashboard';
      } else {
        const r = await api('/auth/login', { method: 'POST', body: { email, password } });
        token = r.token; localStorage.setItem('mh_token', token); me = r.user;
        location.hash = '#/dashboard';
      }
    } catch (err) { toast(err.message, true); b.disabled = false; b.textContent = su? 'Sign Up' : 'Login'; }
  };
}

// Verification disabled - redirect to dashboard
function verifyView() { location.hash = '#/dashboard'; toast('Verification imezimwa kwa sasa - unaingia direct'); }

function banner() {
  if (!me) return '';
  if (me.status === 'trial') return `<div class="${card} p-4 mb-6 flex flex-wrap items-center justify-between gap-3 border-emerald-500/50"><span class="text-sm">🎁 Free trial: <b>${me.daysLeft} days</b> left</span><a href="#/billing" class="${btn2}">Pay early</a></div>`;
  if (me.status === 'expired') return `<div class="${card} p-4 mb-6 flex flex-wrap items-center justify-between gap-3 border-red-500"><span class="text-sm text-red-500">⛔ Your trial has ended. Your projects are suspended.</span><a href="#/billing" class="${btn}">Pay Now</a></div>`;
  if (me.status === 'paid') return `<div class="${card} p-4 mb-6 text-sm">✅ You're paid up. ${me.daysLeft} days left.</div>`;
  return '';
}
const badge = s => { const c = { live: 'emerald', running: 'emerald', starting: 'amber', stopped: 'zinc', suspended: 'red' }[s] || 'zinc'; return `<span class="rounded-full px-2 py-0.5 text-xs bg-${c}-500/15 text-${c}-500 border border-${c}-500/30">${s}</span>`; };
let tab = 'projects', pollT = null;

async function profileView() {
  if (!(await loadMe())) { location.hash = '#/login'; return; }
  nav();
  let p; try { p = await api('/profile'); } catch (e) { toast(e.message, true); return; }
  const row = (a, b) => `<div class="flex justify-between gap-4 py-3 border-t border-zinc-200 dark:border-zinc-900 first:border-0"><span class="text-zinc-500">${a}</span><span class="text-right break-all">${b}</span></div>`;
  $('#app').innerHTML = `<div class="max-w-xl mx-auto px-4 py-12">
    <div class="flex items-center gap-4 mb-8"><div class="h-16 w-16 rounded-full bg-emerald-500/15 text-emerald-500 grid place-items-center text-2xl font-bold">${esc((p.displayName || p.email)[0].toUpperCase())}</div>
      <div><h1 class="text-2xl font-bold">${esc(p.displayName)}</h1><p class="text-sm text-zinc-500">${esc(p.email)}</p></div></div>
    <div class="${card} px-6 py-2">
      ${row('Plan', badge(p.status === 'paid'? 'live' : p.status === 'trial'? 'starting' : 'suspended').replace(/>[^<]+</, `>${esc(p.status)}<`))}
      ${row('Days left', p.daysLeft)}
      ${row('Member since', new Date(p.memberSince).toLocaleDateString())}
      ${row('Projects', `${p.projects} (${p.websites} websites, ${p.bots} bots)`)}
    </div>
    <div class="mt-6 flex gap-2"><a class="${btn}" href="#/settings">Edit settings</a><a class="${btn2}" href="#/billing">Billing</a></div></div>`;
}

async function settingsView() {
  if (!(await loadMe())) { location.hash = '#/login'; return; }
  nav();
  let p; try { p = await api('/profile'); } catch (e) { toast(e.message, true); return; }
  $('#app').innerHTML = `<div class="max-w-xl mx-auto px-4 py-12 space-y-6"><h1 class="text-2xl font-bold">Settings</h1>
    <form id="fn" class="${card} p-6 space-y-3"><h2 class="font-semibold">Profile</h2>
      <label class="text-sm text-zinc-500">Display name</label><input class="${inp}" id="dn" maxlength="40" value="${esc(p.displayName)}" required>
      <label class="text-sm text-zinc-500">Email</label><input class="${inp} opacity-60" value="${esc(p.email)}" disabled>
      <button class="${btn}">Save</button></form>
    <form id="fp" class="${card} p-6 space-y-3"><h2 class="font-semibold">Change password</h2>
      <input class="${inp}" type="password" id="cp" placeholder="Current password" required autocomplete="current-password">
      <input class="${inp}" type="password" id="np" placeholder="New password (at least 8 characters)" minlength="8" required autocomplete="new-password">
      <input class="${inp}" type="password" id="np2" placeholder="Confirm new password" required autocomplete="new-password">
      <button class="${btn}">Update password</button></form>
    <div class="${card} p-6 space-y-3"><h2 class="font-semibold">Appearance</h2>
      <div class="flex gap-2"><button class="${btn2}" id="tl">Light</button><button class="${btn2}" id="td">Dark</button></div></div>
    <form id="fd" class="${card} p-6 space-y-3 border-red-500/50"><h2 class="font-semibold text-red-500">Delete account</h2>
      <p class="text-sm text-zinc-500">This permanently deletes your account and all your projects, and stops your bots. It cannot be undone.</p>
      <input class="${inp}" type="password" id="dp" placeholder="Confirm with your password" required>
      <button class="${btn2} text-red-500">Delete my account</button></form></div>`;
  $('#fn').onsubmit = async e => { e.preventDefault(); try { await api('/profile', { method: 'PUT', body: { displayName: $('#dn').value } }); toast('Profile saved'); } catch (err) { toast(err.message, true); } };
  $('#fp').onsubmit = async e => {
    e.preventDefault();
    if ($('#np').value!== $('#np2').value) return toast('New passwords do not match', true);
    try { await api('/settings/password', { method: 'POST', body: { currentPassword: $('#cp').value, newPassword: $('#np').value } }); toast('Password updated'); e.target.reset(); }
    catch (err) { toast(err.message, true); }
  };
  $('#tl').onclick = () => setTheme(false);
  $('#td').onclick = () => setTheme(true);
  $('#fd').onsubmit = async e => {
    e.preventDefault();
    if (!confirm('Delete your account permanently?')) return;
    try { await api('/account', { method: 'DELETE', body: { password: $('#dp').value } }); toast('Account deleted'); logout(); }
    catch (err) { toast(err.message, true); }
  };
}

async function envModal(id) {
  let keys = [];
  try { keys = (await api(`/projects/${id}/env`)).keys; } catch (e) { return toast(e.message, true); }
  const m = $('#modal');
  m.innerHTML = `<div class="fixed inset-0 z-50 bg-black/60 grid place-items-center p-4"><form id="fe" class="${card} w-full max-w-lg p-5 space-y-3">
    <div class="flex justify-between"><b>Environment variables</b><button type="button" id="ce" class="${btn2}">Close</button></div>
    <p class="text-xs text-zinc-500">Current keys: ${keys.length? keys.map(esc).join(', ') : 'none'}. Values are hidden. Saving replaces ALL variables and restarts the bot.</p>
    <textarea class="${inp} font-mono" rows="6" id="ev" placeholder="BOT_TOKEN=123:abc"></textarea>
    <button class="${btn}">Save and restart</button></form></div>`;
  $('#ce').onclick = () => { m.innerHTML = ''; };
  $('#fe').onsubmit = async e => {
    e.preventDefault();
    try { await api(`/projects/${id}/env`, { method: 'PUT', body: { envVars: $('#ev').value } }); m.innerHTML = ''; toast('Saved. Your bot is restarting.'); renderProjects(); }
    catch (err) { toast(err.message, true); }
  };
}

async function dashView() {
  if (!(await loadMe())) { location.hash = '#/login'; return; }
  nav();
  const tabs = [['projects', 'Your Projects'], ['website', 'Deploy Website'], ['bot', 'Deploy Bot']];
  $('#app').innerHTML = `<div class="max-w-6xl mx-auto px-4 py-10">${banner()}
    <div class="flex gap-1 border-b border-zinc-200 dark:border-zinc-900 mb-8">${tabs.map(t => `<button data-t="${t[0]}" class="px-4 py-2 text-sm -mb-px border-b-2 ${tab === t[0]? 'border-emerald-500 font-medium' : 'border-transparent text-zinc-500'}">${t[1]}</button>`).join('')}</div>
    <div id="tc"></div></div>`;
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; dashView(); });
  clearInterval(pollT);
  if (tab === 'projects') { await renderProjects(); pollT = setInterval(() => { if (location.hash.startsWith('#/dashboard') && tab === 'projects' &&!document.querySelector('#modal>*')) renderProjects(); else if (!location.hash.startsWith('#/dashboard')) clearInterval(pollT); }, 6000); }
  if (tab === 'website') websiteForm();
  if (tab === 'bot') botForm();
}
async function renderProjects() {
  let list; try { list = await api('/projects'); } catch (e) { return; }
  const el = $('#tc'); if (!el) return;
  if (!list.length) { el.innerHTML = `<div class="${card} p-12 text-center"><p class="text-zinc-500 mb-4">You have no projects yet.</p><button class="${btn}" onclick="tab='website';dashView()">Deploy your first project</button></div>`; return; }
  el.innerHTML = summary(list) + `<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">${list.map(p => `<div class="${card} p-5 flex flex-col gap-3">
    <div class="flex items-start justify-between gap-2"><div><div class="font-semibold">${esc(p.name)}</div><div class="text-xs text-zinc-500">${p.type === 'website'? '🌐 Website' : '🤖 ' + esc(p.botType)}</div></div>${badge(p.status)}</div>
    ${p.url? `<a class="text-sm text-emerald-500 break-all hover:underline" target="_blank" rel="noopener" href="${esc(p.url)}">${esc(p.url)}</a>` : '<div class="text-sm text-zinc-500">Bots have no URL — check the logs</div>'}
    ${statLine(p)}
    <div class="flex flex-wrap gap-2 mt-auto">
      ${p.type === 'bot'? `<button class="${btn2}" onclick="logsModal('${p.id}')">Logs</button><button class="${btn2}" onclick="envModal('${p.id}')">Env</button>${p.status === 'running' || p.status === 'starting'? `<button class="${btn2}" onclick="act('${p.id}','restart')">Restart</button><button class="${btn2}" onclick="act('${p.id}','stop')">Stop</button>` : `<button class="${btn2}" onclick="act('${p.id}','start')">Start</button>`}` : ''}
      <button class="${btn2} text-red-500" onclick="delProject('${p.id}')">Delete</button></div></div>`).join('')}</div>`;
}
function fmtUp(s) { if (!s) return '—'; const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d? `${d}d ${h}h` : h? `${h}h ${m}m` : `${m}m`; }
function fmtB(b) { return b > 1048576? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
function summary(l) {
  const c = f => l.filter(f).length;
  const box = (a, b, col = '') => `<div class="${card} p-4"><div class="text-xs text-zinc-500">${a}</div><div class="text-2xl font-bold mt-1 ${col}">${b}</div></div>`;
  return `<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">${box('Projects', l.length)}${box('Online (live / running)', c(p => p.status === 'live' || p.status === 'running'), 'text-emerald-500')}${box('Stopped', c(p => p.status === 'stopped'))}${box('Suspended', c(p => p.status === 'suspended'), 'text-red-500')}</div>`;
}
function statLine(p) {
  const s = p.stats || {}; let t;
  if (p.type === 'bot') t = p.status === 'running'? `⏱ Uptime ${fmtUp(s.uptimeSec)} · Crashes ${s.crashes} · Auto-restarts ${s.autoRestarts}` : `Crashes ${s.crashes || 0}${s.lastExit? ` · Last exit code ${esc(s.lastExit.code)}` : ''}`;
  else t = `${s.files || 0} files · ${fmtB(s.bytes || 0)} · Deployed ${new Date(s.deployedAt || p.createdAt).toLocaleDateString()}`;
  const w = p.suspendedBy === 'admin'? '<div class="text-xs text-red-500">⛔ Suspended by admin</div>' : p.suspendedBy === 'billing'? '<div class="text-xs text-red-500">⛔ Pay to bring it back online</div>' : '';
  return `<div class="text-xs text-zinc-500">${t}</div>${w}`;
}
async function act(id, a) { try { await api(`/projects/${id}/${a}`, { method: 'POST' }); toast('Done'); renderProjects(); } catch (e) { toast(e.message, true); } }
async function delProject(id) { if (!confirm('Delete this project permanently?')) return; try { await api('/projects/' + id, { method: 'DELETE' }); renderProjects(); } catch (e) { toast(e.message, true); } }
async function logsModal(id) {
  const m = $('#modal'); let live = true;
  m.innerHTML = `<div class="fixed inset-0 z-50 bg-black/60 grid place-items-center p-4"><div class="${card} w-full max-w-3xl p-4"><div class="flex justify-between mb-2"><b>Logs</b><button id="cl" class="${btn2}">Close</button></div><pre id="lg" class="bg-black text-green-400 text-xs p-3 rounded-lg h-96 overflow-auto whitespace-pre-wrap"></pre><p class="text-xs text-zinc-500 mt-2">A WhatsApp pairing code or QR will show up here if your bot prints it to the console.</p></div></div>`;
  $('#cl').onclick = () => { live = false; m.innerHTML = ''; };
  const load = async () => { if (!live) return; try { const r = await api(`/projects/${id}/logs`); const el = $('#lg'); if (el) { const bottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 20; el.textContent = r.logs || '(no logs yet)'; if (bottom) el.scrollTop = el.scrollHeight; } } catch {} setTimeout(load, 2500); };
  load();
}
function websiteForm() {
  $('#tc').innerHTML = `<form id="f" class="${card} p-6 max-w-xl space-y-4"><h2 class="font-semibold text-lg">Deploy Website</h2>
    <div><label class="text-sm text-zinc-500">Project Name</label><input class="${inp} mt-1" id="n" required maxlength="40"></div>
    <div><label class="text-sm text-zinc-500">GitHub URL (optional)</label><input class="${inp} mt-1" id="g" placeholder="https://github.com/user/repo"></div>
    <div><label class="text-sm text-zinc-500">OR upload a ZIP (must contain index.html)</label><input class="${inp} mt-1" type="file" id="z" accept=".zip"></div>
    <button class="${btn}" id="sb">Deploy Website</button></form>`;
  $('#f').onsubmit = async e => {
    e.preventDefault(); const fd = new FormData(); fd.append('name', $('#n').value); fd.append('githubUrl', $('#g').value); if ($('#z').files[0]) fd.append('file', $('#z').files[0]);
    const b = $('#sb'); b.disabled = true; b.textContent = 'Deploying...';
    try { const p = await api('/projects/website', { method: 'POST', body: fd }); toast('Live: ' + p.url); tab = 'projects'; dashView(); }
    catch (err) { toast(err.message, true); if (err.status === 402) location.hash = '#/billing'; b.disabled = false; b.textContent = 'Deploy Website'; }
  };
}
function botForm() {
  $('#tc').innerHTML = `<form id="f" class="${card} p-6 max-w-xl space-y-4"><h2 class="font-semibold text-lg">Deploy Bot</h2>
    <div><label class="text-sm text-zinc-500">Bot Name</label><input class="${inp} mt-1" id="n" required maxlength="40"></div>
    <div><label class="text-sm text-zinc-500">Bot type</label><select class="${inp} mt-1" id="t"><option value="baileys">WhatsApp (Baileys)</option><option value="telegram">Telegram</option><option value="discord">Discord</option></select></div>
    <div><label class="text-sm text-zinc-500">Bot ZIP (must contain package.json)</label><input class="${inp} mt-1" type="file" id="z" accept=".zip" required></div>
    <div><label class="text-sm text-zinc-500">Environment variables (optional, one per line: KEY=value)</label><textarea class="${inp} mt-1 font-mono" rows="4" id="e" placeholder="BOT_TOKEN=123:abc"></textarea></div>
    <button class="${btn}" id="sb">Deploy</button></form>`;
  $('#f').onsubmit = async e => {
    e.preventDefault(); const fd = new FormData(); fd.append('name', $('#n').value); fd.append('botType', $('#t').value); fd.append('envVars', $('#e').value); fd.append('file', $('#z').files[0]);
    const b = $('#sb'); b.disabled = true; b.textContent = 'Uploading...';
    try { await api('/projects/bot', { method: 'POST', body: fd }); toast('Your bot is starting. Check the Logs.'); tab = 'projects'; dashView(); }
    catch (err) { toast(err.message, true); if (err.status === 402) location.hash = '#/billing'; b.disabled = false; b.textContent = 'Deploy'; }
  };
}
async function billingView() {
  if (!(await loadMe())) { location.hash = '#/login'; return; }
  nav();
  const q = new URLSearchParams(location.hash.split('?')[1] || '');
  const exp = me.paidUntil || me.trialEndsAt;
  $('#app').innerHTML = `<div class="max-w-xl mx-auto px-4 py-12"><h1 class="text-2xl font-bold mb-6">Billing</h1>
    ${q.get('paid') === '1'? `<div class="${card} p-4 mb-4 border-emerald-500 text-sm">✅ Payment received! Your projects are coming back online.</div>` : q.get('paid') === '0'? `<div class="${card} p-4 mb-4 border-red-500 text-sm">Payment not confirmed yet. If you have paid, refresh in a minute.</div>` : ''}
    <div class="${card} p-6 space-y-4"><div class="flex justify-between"><span class="text-zinc-500">Status</span>${badge(me.status === 'paid'? 'live' : me.status === 'trial'? 'starting' : 'suspended').replace(/>[^<]+</, `>${me.status}<`)}</div>
    <div class="flex justify-between"><span class="text-zinc-500">Days left</span><b>${me.daysLeft}</b></div>
    <div class="flex justify-between"><span class="text-zinc-500">Expires</span><span>${exp? new Date(exp).toLocaleDateString() : '-'}</span></div>
    <div class="flex justify-between"><span class="text-zinc-500">Price</span><b>KES ${me.price} / month</b></div>
    <button id="pay" class="${btn} w-full py-3">Pay Now (M-Pesa / Card)</button>
    <p class="text-xs text-zinc-500">When you pay, 30 days are added on top of the days you have left.</p></div></div>`;
  $('#pay').onclick = async e => { e.target.disabled = true; try { const r = await api('/billing/pay', { method: 'POST' }); location.href = r.url; } catch (err) { toast(err.message, true); e.target.disabled = false; } };
}
async function adminView() {
  if (!atoken) {
    $('#app').innerHTML = `<div class="max-w-sm mx-auto px-4 py-20"><div class="${card} p-8"><h1 class="text-xl font-semibold text-center mb-6">Admin Login</h1><form id="f" class="space-y-3"><input class="${inp}" type="password" id="pw" placeholder="Admin password" required><button class="${btn} w-full">Login</button></form></div></div>`;
    $('#f').onsubmit = async e => { e.preventDefault(); try { const r = await api('/admin/login', { method: 'POST', body: { password: $('#pw').value } }, null); atoken = r.token; sessionStorage.setItem('mh_admin', atoken); adminView(); } catch (err) { toast(err.message, true); } };
    return;
  }
  let d; try { d = await api('/admin/overview', {}, atoken); } catch { atoken = null; sessionStorage.removeItem('mh_admin'); return adminView(); }
  const s = d.stats, stat = (a, b) => `<div class="${card} p-4"><div class="text-xs text-zinc-500">${a}</div><div class="text-2xl font-bold mt-1">${b}</div></div>`;
  const th = 'text-left text-xs text-zinc-500 font-normal py-2 pr-4', td = 'py-2 pr-4 text-sm';
  $('#app').innerHTML = `<div class="max-w-6xl mx-auto px-4 py-10 space-y-10">
    <div class="flex justify-between items-center"><h1 class="text-2xl font-bold">Admin Panel</h1><button class="${btn2}" onclick="atoken=null;sessionStorage.removeItem('mh_admin');adminView()">Logout</button></div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">${stat('Users', s.users)}${stat('Free trial', s.trial)}${stat('Paid', s.paid)}${stat('Unpaid (expired)', s.expired)}${stat('Blocked', s.blocked)}${stat('Projects', s.projects)}${stat('Live sites', s.liveSites)}${stat('Bots running', s.runningBots)}${stat('Revenue', 'KES ' + s.revenue)}</div>
    <section><h2 class="font-semibold mb-3">Users</h2><div class="${card} p-4 overflow-x-auto"><table class="w-full"><tr><th class="${th}">Email</th><th class="${th}">Status</th><th class="${th}">Days left</th><th class="${th}">Projects</th><th class="${th}"></th></tr>
    ${d.users.map(u => `<tr class="border-t border-zinc-200 dark:border-zinc-900"><td class="${td}">${esc(u.email)}</td><td class="${td}">${esc(u.status)}</td><td class="${td}">${u.daysLeft}</td><td class="${td}">${u.projects}</td><td class="${td} flex gap-2"><button class="${btn2}" onclick="adm('/users/${u.id}/block',{blocked:${!u.blocked}})">${u.blocked? 'Unblock' : 'Block'}</button><button class="${btn2}" onclick="adm('/users/${u.id}/extend',{days:30})">+30d</button></td></tr>`).join('')}</table></div></section>
    <section><h2 class="font-semibold mb-3">Projects</h2><div class="${card} p-4 overflow-x-auto"><table class="w-full"><tr><th class="${th}">Name</th><th class="${th}">Owner</th><th class="${th}">Type</th><th class="${th}">Status</th><th class="${th}"></th></tr>
    ${d.projects.map(p => `<tr class="border-t border-zinc-200 dark:border-zinc-900"><td class="${td}">${esc(p.name)}</td><td class="${td}">${esc(p.owner)}</td><td class="${td}">${esc(p.type)}</td><td class="${td}">${esc(p.status)}</td><td class="${td} flex gap-2"><button class="${btn2}" onclick="adm('/projects/${p.id}/suspend',{suspended:${p.suspendedBy!== 'admin'}})">${p.suspendedBy === 'admin'? 'Resume' : 'Suspend'}</button><button class="${btn2} text-red-500" onclick="if(confirm('Delete this project?'))adm('/projects/${p.id}',null,'DELETE')">Delete</button></td></tr>`).join('')}</table></div></section>
    <section><h2 class="font-semibold mb-3">Payments</h2><div class="${card} p-4 overflow-x-auto"><table class="w-full"><tr><th class="${th}">Date</th><th class="${th}">Email</th><th class="${th}">Amount</th><th class="${th}">Channel</th></tr>
    ${d.payments.map(p => `<tr class="border-t border-zinc-200 dark:border-zinc-900"><td class="${td}">${new Date(p.at).toLocaleString()}</td><td class="${td}">${esc(p.email)}</td><td class="${td}">KES ${p.amount}</td><td class="${td}">${esc(p.channel)}</td></tr>`).join('') || `<tr><td class="${td} text-zinc-500" colspan=4>No payments yet</td></tr>`}</table></div></section></div>`;
}
async function adm(path, body, method) { try { await api('/admin' + path, { method: method || 'POST', body }, atoken); adminView(); } catch (e) { toast(e.message, true); } }

function route() {
  const h = (location.hash || '#/').split('?')[0];
  clearInterval(pollT); $('#modal').innerHTML = ''; nav(); window.scrollTo(0, 0);
  if (h === '#/dashboard') return dashView();
  if (h === '#/billing') return billingView();
  if (h === '#/profile') return profileView();
  if (h === '#/settings') return settingsView();
  if (h === '#/admin') return adminView();
  if (token && (h === '#/login' || h === '#/signup')) { location.hash = '#/dashboard'; return; }
  if (h === '#/login') return authView('login');
  if (h === '#/signup') return authView('signup');
  if (h === '#/verify') return verifyView();
  landing();
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
